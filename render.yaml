# Render Blueprint: Dashboard → New → Blueprint → choose this repository → Apply.
# Creates the site (web client + API in one Docker service) and a free Postgres database.
# Free plan: the service sleeps after 15 min idle (first visit ~1 min), the free database is
# deleted after 30 days, uploaded photos are lost on restart. Fine for testing — see DEPLOY.md.
services:
  - type: web
    name: master-ryadom
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/render.Dockerfile
    dockerContext: ./
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: master-ryadom-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      # production: the server refuses to start with unsafe settings and hides /api/docs.
      - key: ENVIRONMENT
        value: production
      # Only our own site may call the API from a browser (the Android app opens the same site).
      - key: CORS_ORIGINS
        value: https://master-ryadom.onrender.com
      # Render sits behind Cloudflare: the real visitor IP (for login/request limits) is in this header.
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip
      # Real email through Brevo. SMTP_USER / SMTP_PASSWORD are secrets: Render asks for them when the
      # Blueprint is applied (sync: false), they are never stored in git. Port 2525 because Render's free
      # plan blocks outgoing traffic to the usual SMTP ports 25/465/587.
      - key: EMAIL_PROVIDER
        value: smtp
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_SECURITY
        value: starttls
      - key: SMTP_FROM
        value: "Мастер рядом <masteryadomkg@gmail.com>"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      # Admin account (no shell on the free plan): created at startup if missing. Log in at /login.html.
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: REDIS_URL
        value: ""
      - key: SUBSCRIPTIONS_ENABLED
        value: "false"

databases:
  - name: master-ryadom-db
    plan: free
