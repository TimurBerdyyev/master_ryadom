<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="master.docTitle">Профиль мастера — Мастер рядом</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="logo" href="index.html"><span class="logo-mark"><svg class="i" aria-hidden="true"><use href="#i-wrench"></use></svg></span> Мастер рядом</a>
    <nav id="nav"></nav>
  </header>

  <main id="content">
    <div class="skeleton" style="height:176px;margin-bottom:24px"></div>
    <div class="skeleton" style="height:320px"></div>
  </main>

  <script src="js/icons.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script>
    const masterId = new URLSearchParams(location.search).get("id");

    function contactBlock(master) {
      const categoryId = master.services[0]?.category_id;
      const orderHref = `order.html${categoryId ? `?category_id=${categoryId}` : ""}`;
      const phoneBlock = master.user.phone
        ? `
          <a class="btn block large" href="${esc(telLink(master.user.phone))}">${icon("phone")}${t("common.call")} · ${esc(master.user.phone)}</a>
          <a class="btn whatsapp block" href="${esc(waLink(master.user.phone))}" target="_blank" rel="noopener noreferrer">${icon("message-circle")}${t("master.whatsapp")}</a>`
        : "";
      return `
        <div class="card-box">
          <div class="stats-row">
            <div><b>${master.rating.toFixed(1)}</b><span>${t("master.statRating")}</span></div>
            <div><b>${master.completed_orders}</b><span>${t("master.statOrders")}</span></div>
            <div><b>${master.experience_years || "—"}</b><span>${t("master.statYears")}</span></div>
          </div>
          <div class="contact-actions">
            ${phoneBlock}
            <a class="btn accent block" href="${orderHref}">${icon("timer")}${t("nav.createOrder")}</a>
          </div>
          ${master.verified ? `<p class="aside-note guarantee-note">${icon("shield-check")}<span>${t("guarantee.tip")}</span></p>` : ""}
          <p class="aside-note">${icon("clock")}<span>${t("master.note")}</span></p>
        </div>`;
    }

    async function load() {
      const content = document.getElementById("content");
      const notFound = (title, text) => emptyState("search-x", title, text,
        `<a class="btn" href="masters.html">${t("master.toSearch")}</a>`);
      if (!/^\d+$/.test(masterId || "")) {
        content.innerHTML = notFound(t("master.notFound"), t("master.linkOld"));
        return;
      }
      try {
        const [master, reviews] = await Promise.all([api.getMaster(masterId), api.masterReviews(masterId)]);
        document.title = `${master.user.name} — Мастер рядом`;

        content.innerHTML = `
          <a class="back-link" href="masters.html">${icon("arrow-left", "sm")}${t("home.allMasters")}</a>
          <div class="profile-cover">
            <div class="profile-header">
              ${avatarHtml(master.user.name, "avatar", master.user.photo)}
              <div>
                <h1>${esc(master.user.name)} ${master.verified ? verifiedBadge() : ""}</h1>
                <div class="meta">
                  ${ratingHtml(master.rating)}
                  <span>${icon("message-circle")}${plural(reviews.length, "p.reviews")}</span>
                  <span>${icon("briefcase")}${plural(master.completed_orders, "p.orders")}</span>
                  ${master.city ? `<span>${icon("map-pin")}${esc(cityName(master.city))}${master.district ? ", " + esc(master.district) : ""}</span>` : ""}
                </div>
              </div>
            </div>
          </div>

          <div class="profile-layout">
            <div class="reveal">
              ${master.description ? `
                <div class="card-box">
                  <h2>${t("master.about")}</h2>
                  <div style="white-space:pre-wrap;color:var(--ink-2)">${esc(master.description)}</div>
                </div>` : ""}

              <div class="section-title">${t("master.services")}</div>
              <div class="card-box" style="padding-top:4px;padding-bottom:4px">
                ${master.services.length
                  ? master.services.map(s => `<div class="service-row"><span>${esc(s.title)}</span><span class="price">${priceFrom(s.price_from)}</span></div>`).join("")
                  : `<p class="muted">${t("master.noServices")}</p>`}
              </div>

              ${master.photos.length ? `
                <div class="section-title">${t("master.photos")}</div>
                <div class="photo-grid">
                  ${master.photos.map(p => `<a href="${esc(uploadUrl(p.url))}" target="_blank" rel="noopener"><img class="photo-thumb" src="${esc(uploadUrl(p.url))}" alt="${t("master.photoAlt")}" loading="lazy" /></a>`).join("")}
                </div>` : ""}

              <div class="section-title">${t("master.reviews")} ${reviews.length ? `<span class="muted" style="font-family:var(--font-text);font-weight:500">· ${reviews.length}</span>` : ""}</div>
              ${reviews.length
                ? reviews.map(r => `
                  <div class="review">
                    <div class="row">${starsHtml(r.rating)}<span class="spacer"></span><span class="date">${formatDate(r.created_at)}</span></div>
                    ${r.text ? `<div style="margin-top:8px;white-space:pre-wrap">${esc(r.text)}</div>` : ""}
                  </div>`).join("")
                : emptyState("message-circle", t("master.noReviews"), t("master.noReviewsText"))}
            </div>
            <aside>${contactBlock(master)}</aside>
          </div>
        `;
      } catch (e) {
        content.innerHTML = notFound(esc(e.message), "");
      }
    }

    load();
    renderNav();
  </script>
</body>
</html>
