<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title data-i18n="feed.docTitle">Новые заказы — Мастер рядом</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Мастер рядом" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .offer-form {
      display: grid;
      grid-template-columns: 170px minmax(0, 1fr) auto;
      gap: 10px;
      margin-top: 16px;
      padding: 12px;
      border-radius: 14px;
      background: var(--surface-2);
    }

    @media (max-width: 600px) {
      .offer-form {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="logo" href="index.html"><span class="logo-mark"><svg class="i" aria-hidden="true"><use href="#i-wrench"></use></svg></span> Мастер рядом</a>
    <nav id="nav"></nav>
  </header>

  <main class="narrow">
    <div class="page-head">
      <div>
        <h1 data-i18n="nav.feed">Новые заказы</h1>
        <p class="city-chip" id="cityChip" hidden></p>
        <p class="muted" data-i18n="feed.sub">Заявки в ваших категориях и городе. Адрес и телефон клиента откроются, когда он выберет вас.</p>
      </div>
      <button class="btn secondary" onclick="load()"><svg class="i" aria-hidden="true"><use href="#i-refresh-cw"></use></svg><span data-i18n="feed.refresh">Обновить</span></button>
    </div>

    <div id="planBanner"></div>
    <div class="notice" id="ruleNotice" hidden style="margin-bottom:16px"><svg class="i" aria-hidden="true"><use href="#i-timer"></use></svg><span data-i18n="feed.rule"></span></div>
    <div id="list" class="stack"></div>
  </main>

  <script src="js/icons.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script>
    const loggedIn = requireLogin("feed.html");

    let categories = {};
    let orders = [];
    let masterProfile = null;

    // No new requests: the master's own home screen instead of an empty page.
    async function renderMasterHome() {
      const list = document.getElementById("list");
      const p = masterProfile;
      const ACTIVE = ["master_selected", "master_confirmed", "master_en_route", "in_progress"];
      const [jobs, chats] = await Promise.all([
        api.myOrders().catch(() => []),
        api.chats().catch(() => []),
      ]);
      const active = jobs.filter(o => ACTIVE.includes(o.status));
      const steps = [Boolean(p.user.photo), Boolean(p.description && p.description.trim().length >= 20),
        p.services.length > 0, p.photos.length > 0, p.verified, p.location_shared];
      const percent = Math.round(steps.filter(Boolean).length / steps.length * 100);
      const unread = chats.reduce((n, c) => n + c.unread, 0);

      list.innerHTML = `
        <div class="mh-hero">
          <span class="mh-hero-ico">${icon("inbox")}</span>
          <div>
            <h2>${t("mh.noOrders")}</h2>
            <p>${t("mh.noOrdersText")}</p>
          </div>
        </div>

        <div class="mh-stats">
          <div><b>${Number(p.rating).toFixed(1)}</b><span>${t("master.statRating")}</span></div>
          <div><b>${p.completed_orders}</b><span>${t("master.statOrders")}</span></div>
          <div><b>${p.missed_requests}</b><span>${t("edit.missed")}</span></div>
        </div>

        ${active.length ? `
          <section class="mh-section">
            <div class="mh-head"><h3>${t("mh.activeJobs")}</h3><a class="link small" href="orders.html">${t("home.seeAll")} →</a></div>
            ${active.slice(0, 3).map(o => `
              <a class="mh-row" href="order-detail.html?id=${o.id}">
                ${categoryBadge(categories[o.category_id] || "")}
                <span class="mh-row-body"><b>${esc(catName(categories[o.category_id] || "") || t("common.order"))} #${o.id}</b><small>${esc(o.description.slice(0, 80))}</small></span>
                ${statusPillHtml(o.status)}
              </a>`).join("")}
          </section>` : ""}

        <section class="mh-section">
          <div class="mh-head"><h3>${t("nav.messages")}${unread ? ` <span class="chat-unread">${unread}</span>` : ""}</h3><a class="link small" href="chats.html">${t("home.seeAll")} →</a></div>
          ${chats.length ? chats.slice(0, 3).map(c => `
            <a class="mh-row" href="chat.html?id=${c.id}">
              ${avatarHtml(c.client_name, "avatar", null)}
              <span class="mh-row-body"><b>${esc(c.client_name)}</b><small>${c.last_is_photo ? t("chat.photo") : esc((c.last_message || "").slice(0, 80))}</small></span>
              ${c.unread ? `<span class="chat-unread">${c.unread}</span>` : ""}
            </a>`).join("") : `<p class="muted mh-empty">${t("chat.emptyMaster")}</p>`}
        </section>

        <section class="mh-section">
          <div class="mh-head"><h3>${t("mh.profileTitle", { percent })}</h3></div>
          <div class="cab-bar"><span style="width:${percent}%"></span></div>
          <p class="muted" style="margin:10px 0 12px">${percent < 100 ? t("mh.profileText") : t("mh.profileDone")}</p>
          <a class="btn secondary" href="master-profile-edit.html#overview">${icon("settings-2")}${t("mh.openProfile")}</a>
        </section>

        <section class="mh-section mh-tips">
          <h3>${t("mh.tipsTitle")}</h3>
          <ul>
            <li>${icon("camera")}<span>${t("mh.tip1")}</span></li>
            <li>${icon("timer")}<span>${t("mh.tip2")}</span></li>
            <li>${icon("map-pin")}<span>${t("mh.tip3")}</span></li>
            <li>${icon("hand-coins")}<span>${t("mh.tip4")}</span></li>
          </ul>
        </section>`;
    }

    function offerForm(o) {
      const mine = o.my_offer;
      return `
        <form class="offer-form" onsubmit="event.preventDefault(); sendOffer(${o.id});">
          <span class="input-icon">${icon("wallet")}<input class="input" id="price-${o.id}" type="number" min="0" max="10000000" required
                 placeholder="${t("feed.pricePh")}" aria-label="${t("feed.priceAria")}" value="${mine ? Number(mine.price) : ""}" /></span>
          <input class="input" id="comment-${o.id}" type="text" maxlength="1000" aria-label="${t("feed.commentAria")}"
                 placeholder="${t("feed.commentPh")}" value="${mine && mine.comment ? esc(mine.comment) : ""}" />
          <span class="offer-actions">
            <button class="btn ${mine ? "secondary" : "accent"}" type="submit">${icon(mine ? "pencil" : "send")}${mine ? t("feed.update") : t("feed.offer")}</button>
            ${mine ? "" : `<button class="btn ghost" type="button" onclick="decline(${o.id})">${icon("ban")}${t("feed.decline")}</button>`}
          </span>
        </form>`;
    }

    // "Answer within 14:32" while the master's 20-minute timer runs.
    function deadlineHtml(o) {
      if (o.my_offer || o.my_status === "offered") return `<span class="countdown done">${icon("circle-check")}${t("feed.answered")}</span>`;
      if (!o.deadline_at || o.my_status !== "pending") return "";
      const left = secondsLeft(o.deadline_at);
      if (left <= 0) return `<span class="countdown over">${icon("hourglass")}${t("feed.overdue")}</span>`;
      return `<span class="countdown${left < 300 ? " urgent" : ""}" data-deadline="${esc(o.deadline_at)}">${icon("timer")}<span>${t("feed.timeLeft", { time: formatCountdown(left) })}</span></span>`;
    }

    function render() {
      const list = document.getElementById("list");
      // Keep what the master is typing when the list refreshes by itself.
      const typed = {};
      list.querySelectorAll(".offer-form input").forEach(input => { if (input.value) typed[input.id] = input.value; });
      if (!orders.length) {
        list.classList.remove("reveal");
        renderMasterHome();
        return;
      }
      list.classList.add("reveal");
      list.innerHTML = orders.map(o => {
        const cat = categories[o.category_id] || "";
        return `
          <div class="order-card">
            <div class="top">
              <span class="title">${categoryBadge(cat)}${esc(cat ? catName(cat) : t("common.order"))}</span>
              <span class="num">#${o.id}</span>
              <span class="spacer"></span>
              ${o.my_offer ? `<span class="status-pill ok">${t("feed.youOffered", { price: formatPrice(o.my_offer.price) })}</span>` : `<span class="status-pill info">${t("feed.new")}</span>`}
            </div>
            <div class="deadline-row" style="margin:12px 0 10px">${deadlineHtml(o)}</div>
            <div class="desc">${esc(o.description)}</div>
            ${o.photos.length ? `<div class="photo-grid" style="margin:14px 0 0;grid-template-columns:repeat(auto-fill,minmax(84px,1fr))">${o.photos.map(p =>
              `<a href="${esc(uploadUrl(p.url))}" target="_blank" rel="noopener"><img class="photo-thumb" src="${esc(uploadUrl(p.url))}" alt="${t("detail.photoAlt")}" loading="lazy" /></a>`).join("")}</div>` : ""}
            <div class="foot">
              <span>${icon("clock")}${formatDate(o.created_at, true)}</span>
              ${o.date ? `<span>${icon("calendar")}${t("feed.needBy", { date: formatDate(o.date) + (o.time ? ", " + esc(o.time) : "") })}</span>` : ""}
              ${o.price ? `<span>${icon("wallet")}${t("feed.budget", { price: formatPrice(o.price) })}</span>` : ""}
              <span>${icon("users")}${plural(o.offers_count, "p.offers")}</span>
            </div>
            ${offerForm(o)}
          </div>`;
      }).join("");
      for (const [id, value] of Object.entries(typed)) {
        const input = document.getElementById(id);
        if (input) input.value = value;
      }
    }

    async function load(quiet = false) {
      const list = document.getElementById("list");
      if (!quiet) list.innerHTML = skeletons(3, 200);
      try {
        const me = await api.me();
        if (me.role !== "master") {
          list.innerHTML = emptyState("briefcase", t("feed.onlyMasters"), t("feed.onlyMastersText"),
            `<a class="btn" href="masters.html">${t("nav.find")}</a>`);
          return;
        }
        renderPlanBanner();
        const profile = await api.myMasterProfile();
        masterProfile = profile;
        const chip = document.getElementById("cityChip");
        if (!profile.city) {
          chip.hidden = true;
          list.innerHTML = emptyState("map-pin", t("feed.noCityTitle"), t("feed.noCityText"),
            `<a class="btn" href="master-profile-edit.html#profile">${icon("map-pin")}${t("feed.chooseCity")}</a>`);
          return;
        }
        if (!profile.agreement_accepted) {
          list.innerHTML = emptyState("scroll-text", t("feed.agreeTitle"), t("feed.agreeText"),
            `<a class="btn accent" href="master-profile-edit.html">${icon("scroll-text")}${t("feed.toProfile")}</a>`);
          return;
        }
        await getRegions().catch(() => {});
        const where = profile.serves_region && profile.region && profile.region !== `г. ${profile.city}`
          ? t("place.plusRegion", { place: esc(cityName(profile.city)), region: esc(cityName(profile.region)) })
          : esc(cityName(profile.city));
        chip.innerHTML = `${icon("map-pin")}<b>${where}</b> · <a class="link" href="master-profile-edit.html#profile">${t("city.change")}</a>`;
        chip.hidden = false;
        const [feed, cats] = await Promise.all([api.orderFeed(), api.categories()]);
        orders = feed;
        document.getElementById("ruleNotice").hidden = false;
        categories = Object.fromEntries(cats.map(c => [c.id, c.name]));
        render();
      } catch (e) {
        list.innerHTML = e.status === 402
          ? paywall()
          : e.status === 403
          ? emptyState("shield-check", t("feed.notVerifiedTitle"), t("feed.notVerifiedText"),
              `<a class="btn" href="master-profile-edit.html">${icon("settings-2")}${t("feed.toProfile")}</a>`)
          : emptyState("triangle-alert", t("orders.loadError"), esc(e.message));
      }
    }

    function paywall() {
      return emptyState("lock", t("sub.stateExpired"), t("sub.expiredText"),
        `<a class="btn accent" href="subscription.html">${icon("wallet")}${t("feed.renew")}</a>`);
    }

    // Heads-up a few days before the trial/paid period runs out (only when paid plans are on).
    async function renderPlanBanner() {
      const box = document.getElementById("planBanner");
      try {
        const sub = await api.mySubscription();
        if (!sub.enabled || sub.state === "expired" || sub.days_left > 5) {
          box.innerHTML = "";
          return;
        }
        const key = sub.state === "trial" ? "feed.trialBanner" : "feed.subBanner";
        box.innerHTML = `
          <div class="notice plan-banner">
            ${icon("timer")}<span>${t(key, { days: plural(sub.days_left, "p.days") })}</span>
            <span class="spacer"></span>
            <a class="btn small accent" href="subscription.html">${t("feed.renew")}</a>
          </div>`;
      } catch (e) {
        box.innerHTML = "";
      }
    }

    async function sendOffer(orderId) {
      const price = Number(document.getElementById(`price-${orderId}`).value);
      const comment = document.getElementById(`comment-${orderId}`).value.trim() || null;
      try {
        await api.makeOffer(orderId, { price, comment });
        toast(t("feed.sent"));
        load();
      } catch (e) {
        toast(t("common.error") + e.message);
        if (e.status === 402) load();  // subscription ran out meanwhile: show the paywall
      }
    }

    async function decline(orderId) {
      try {
        await api.declineOrder(orderId);
        toast(t("feed.declined"));
        orders = orders.filter(o => o.id !== orderId);
        render();
      } catch (e) {
        toast(t("common.error") + e.message);
      }
    }

    if (loggedIn) {
      load();
      setInterval(() => {
        document.querySelectorAll("[data-deadline]").forEach(el => {
          const left = secondsLeft(el.dataset.deadline);
          if (left <= 0) {
            el.className = "countdown over";
            el.innerHTML = `${icon("hourglass")}${t("feed.overdue")}`;
            delete el.dataset.deadline;
            return;
          }
          el.classList.toggle("urgent", left < 300);
          el.querySelector("span").textContent = t("feed.timeLeft", { time: formatCountdown(left) });
        });
      }, 1000);
      // New requests show up without pressing "Обновить".
      setInterval(() => {
        const busy = document.activeElement && document.activeElement.closest && document.activeElement.closest(".offer-form");
        if (!document.hidden && !busy && orders) load(true);
      }, 60000);
    }
    renderNav();
  </script>
</body>
</html>
