<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Новые заказы — Мастер рядом</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="logo" href="index.html"><span class="logo-mark">🔧</span> Мастер рядом</a>
    <nav id="nav"></nav>
  </header>

  <main class="narrow">
    <div class="page-head">
      <div>
        <h1>Новые заказы</h1>
        <p class="muted">Открытые заказы в ваших категориях. Адрес и телефон клиента откроются, когда он выберет вас.</p>
      </div>
      <button class="btn secondary" onclick="load()">↻ Обновить</button>
    </div>

    <div id="list" class="stack"></div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script>
    const loggedIn = requireLogin("feed.html");

    let categories = {};
    let orders = [];

    function offerForm(o) {
      const mine = o.my_offer;
      return `
        <form class="row" style="margin-top:14px" onsubmit="event.preventDefault(); sendOffer(${o.id});">
          <input class="field-input" id="price-${o.id}" type="number" min="0" max="10000000" required placeholder="Ваша цена, сом"
                 value="${mine ? Number(mine.price) : ""}" style="width:150px;padding:10px 12px;border:1px solid var(--color-border);border-radius:10px" />
          <input id="comment-${o.id}" type="text" maxlength="1000" placeholder="Комментарий: когда сможете приехать"
                 value="${mine && mine.comment ? esc(mine.comment) : ""}" style="flex:1;min-width:180px;padding:10px 12px;border:1px solid var(--color-border);border-radius:10px" />
          <button class="btn" type="submit">${mine ? "Изменить цену" : "Предложить цену"}</button>
        </form>`;
    }

    function render() {
      const list = document.getElementById("list");
      if (!orders.length) {
        list.innerHTML = `
          <div class="empty">
            <div class="emoji">📭</div>
            <h3>Новых заказов пока нет</h3>
            <p>Заказы появляются в категориях ваших услуг. Добавьте услуги в профиль, чтобы видеть больше заказов.</p>
            <a class="btn" href="master-profile-edit.html">Мои услуги</a>
          </div>`;
        return;
      }
      list.innerHTML = orders.map(o => {
        const cat = categories[o.category_id] || "Заказ";
        return `
          <div class="order-card">
            <div class="top">
              <span class="title">${categoryIcon(cat)} ${esc(cat)}</span>
              <span class="muted">#${o.id}</span>
              <span class="spacer"></span>
              ${o.my_offer ? `<span class="status-pill ok">Вы предложили ${formatPrice(o.my_offer.price)}</span>` : '<span class="status-pill info">Новый</span>'}
            </div>
            <div class="desc">${esc(o.description)}</div>
            ${o.photos.length ? `<div class="photo-grid" style="margin:12px 0 0;grid-template-columns:repeat(auto-fill,minmax(80px,1fr))">${o.photos.map(p =>
              `<a href="${esc(uploadUrl(p.url))}" target="_blank" rel="noopener"><img class="photo-thumb" src="${esc(uploadUrl(p.url))}" alt="Фото" loading="lazy" /></a>`).join("")}</div>` : ""}
            <div class="foot">
              <span>🕒 ${formatDate(o.created_at, true)}</span>
              ${o.date ? `<span>🗓 Нужно: ${formatDate(o.date)}${o.time ? ", " + esc(o.time) : ""}</span>` : ""}
              ${o.price ? `<span>💰 Бюджет клиента: <b>${formatPrice(o.price)}</b></span>` : ""}
              <span>💬 ${o.offers_count} ${pluralize(o.offers_count, "предложение", "предложения", "предложений")}</span>
            </div>
            ${offerForm(o)}
          </div>`;
      }).join("");
    }

    async function load() {
      const list = document.getElementById("list");
      list.innerHTML = skeletons(3, 170);
      try {
        const me = await api.me();
        if (me.role !== "master") {
          list.innerHTML = `<div class="empty"><div class="emoji">🧰</div><h3>Эта страница для мастеров</h3><p>Зарегистрируйтесь как мастер, чтобы получать заказы.</p><a class="btn" href="masters.html">Найти мастера</a></div>`;
          return;
        }
        const [feed, cats] = await Promise.all([api.orderFeed(), api.categories()]);
        orders = feed;
        categories = Object.fromEntries(cats.map(c => [c.id, c.name]));
        render();
      } catch (e) {
        list.innerHTML = `<p class="error">Ошибка: ${esc(e.message)}</p>`;
      }
    }

    async function sendOffer(orderId) {
      const price = Number(document.getElementById(`price-${orderId}`).value);
      const comment = document.getElementById(`comment-${orderId}`).value.trim() || null;
      try {
        await api.makeOffer(orderId, { price, comment });
        toast("Предложение отправлено клиенту");
        load();
      } catch (e) {
        toast("Ошибка: " + e.message);
      }
    }

    if (loggedIn) load();
    renderNav();
  </script>
</body>
</html>
