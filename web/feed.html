<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Новые заказы — Мастер рядом</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .offer-form {
      display: grid;
      grid-template-columns: 170px minmax(0, 1fr) auto;
      gap: 10px;
      margin-top: 16px;
      padding: 12px;
      border-radius: 14px;
      background: var(--surface-2);
    }

    @media (max-width: 600px) {
      .offer-form {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="logo" href="index.html"><span class="logo-mark"><svg class="i" aria-hidden="true"><use href="#i-wrench"></use></svg></span> Мастер рядом</a>
    <nav id="nav"></nav>
  </header>

  <main class="narrow">
    <div class="page-head">
      <div>
        <h1>Новые заказы</h1>
        <p class="muted">Открытые заказы в ваших категориях. Адрес и телефон клиента откроются, когда он выберет вас.</p>
      </div>
      <button class="btn secondary" onclick="load()"><svg class="i" aria-hidden="true"><use href="#i-refresh-cw"></use></svg>Обновить</button>
    </div>

    <div id="list" class="stack"></div>
  </main>

  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script>
    const loggedIn = requireLogin("feed.html");

    let categories = {};
    let orders = [];

    function offerForm(o) {
      const mine = o.my_offer;
      return `
        <form class="offer-form" onsubmit="event.preventDefault(); sendOffer(${o.id});">
          <span class="input-icon">${icon("wallet")}<input class="input" id="price-${o.id}" type="number" min="0" max="10000000" required
                 placeholder="Цена, сом" aria-label="Ваша цена" value="${mine ? Number(mine.price) : ""}" /></span>
          <input class="input" id="comment-${o.id}" type="text" maxlength="1000" aria-label="Комментарий"
                 placeholder="Комментарий: когда сможете приехать" value="${mine && mine.comment ? esc(mine.comment) : ""}" />
          <button class="btn ${mine ? "secondary" : "accent"}" type="submit">${icon(mine ? "pencil" : "send")}${mine ? "Изменить" : "Предложить"}</button>
        </form>`;
    }

    function render() {
      const list = document.getElementById("list");
      if (!orders.length) {
        list.classList.remove("reveal");
        list.innerHTML = emptyState("inbox", "Новых заказов пока нет",
          "Заказы появляются в категориях ваших услуг. Добавьте больше услуг в профиль, чтобы видеть больше заказов.",
          `<a class="btn" href="master-profile-edit.html">${icon("settings-2")}Мои услуги</a>`);
        return;
      }
      list.classList.add("reveal");
      list.innerHTML = orders.map(o => {
        const cat = categories[o.category_id] || "Заказ";
        return `
          <div class="order-card">
            <div class="top">
              <span class="title">${categoryBadge(cat)}${esc(cat)}</span>
              <span class="num">#${o.id}</span>
              <span class="spacer"></span>
              ${o.my_offer ? `<span class="status-pill ok">Вы предложили ${formatPrice(o.my_offer.price)}</span>` : '<span class="status-pill info">Новый</span>'}
            </div>
            <div class="desc">${esc(o.description)}</div>
            ${o.photos.length ? `<div class="photo-grid" style="margin:14px 0 0;grid-template-columns:repeat(auto-fill,minmax(84px,1fr))">${o.photos.map(p =>
              `<a href="${esc(uploadUrl(p.url))}" target="_blank" rel="noopener"><img class="photo-thumb" src="${esc(uploadUrl(p.url))}" alt="Фото к заказу" loading="lazy" /></a>`).join("")}</div>` : ""}
            <div class="foot">
              <span>${icon("clock")}${formatDate(o.created_at, true)}</span>
              ${o.date ? `<span>${icon("calendar")}Нужно ${formatDate(o.date)}${o.time ? ", " + esc(o.time) : ""}</span>` : ""}
              ${o.price ? `<span>${icon("wallet")}Бюджет <b>${formatPrice(o.price)}</b></span>` : ""}
              <span>${icon("users")}${o.offers_count} ${pluralize(o.offers_count, "предложение", "предложения", "предложений")}</span>
            </div>
            ${offerForm(o)}
          </div>`;
      }).join("");
    }

    async function load() {
      const list = document.getElementById("list");
      list.innerHTML = skeletons(3, 200);
      try {
        const me = await api.me();
        if (me.role !== "master") {
          list.innerHTML = emptyState("briefcase", "Эта страница для мастеров",
            "Зарегистрируйтесь как мастер, чтобы получать заказы.", `<a class="btn" href="masters.html">Найти мастера</a>`);
          return;
        }
        const [feed, cats] = await Promise.all([api.orderFeed(), api.categories()]);
        orders = feed;
        categories = Object.fromEntries(cats.map(c => [c.id, c.name]));
        render();
      } catch (e) {
        list.innerHTML = emptyState("triangle-alert", "Не удалось загрузить заказы", esc(e.message));
      }
    }

    async function sendOffer(orderId) {
      const price = Number(document.getElementById(`price-${orderId}`).value);
      const comment = document.getElementById(`comment-${orderId}`).value.trim() || null;
      try {
        await api.makeOffer(orderId, { price, comment });
        toast("Предложение отправлено клиенту");
        load();
      } catch (e) {
        toast("Ошибка: " + e.message);
      }
    }

    if (loggedIn) load();
    renderNav();
  </script>
</body>
</html>
