<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Регистрация — Мастер рядом</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="logo" href="index.html"><span class="logo-mark"><svg class="i" aria-hidden="true"><use href="#i-wrench"></use></svg></span> Мастер рядом</a>
    <nav id="nav"></nav>
  </header>

  <main>
    <div class="auth-wrap reveal">
      <div class="auth-head">
        <div class="badge-icon"><svg class="i " aria-hidden="true"><use href="#i-sparkles"></use></svg></div>
        <h1>Создать аккаунт</h1>
        <p>Это займёт меньше минуты</p>
      </div>

      <form class="card" id="registerForm">
        <div class="role-picker" role="radiogroup" aria-label="Тип аккаунта">
          <input type="radio" name="role" id="roleClient" value="client" checked />
          <label for="roleClient"><svg class="i " aria-hidden="true"><use href="#i-house"></use></svg>Ищу мастера<small>Создаю заказы</small></label>
          <input type="radio" name="role" id="roleMaster" value="master" />
          <label for="roleMaster"><svg class="i " aria-hidden="true"><use href="#i-briefcase"></use></svg>Я мастер<small>Получаю заказы</small></label>
        </div>
        <label>
          Имя
          <span class="input-icon"><svg class="i " aria-hidden="true"><use href="#i-user"></use></svg><input id="name" type="text" autocomplete="name" required maxlength="255" placeholder="Как к вам обращаться" /></span>
        </label>
        <label>
          Телефон
          <span class="input-icon"><svg class="i " aria-hidden="true"><use href="#i-phone"></use></svg><input id="phone" type="tel" autocomplete="tel" placeholder="+996 700 000 000" required maxlength="32" /></span>
        </label>
        <label>
          Пароль
          <span class="input-icon"><svg class="i " aria-hidden="true"><use href="#i-lock"></use></svg><input id="password" type="password" autocomplete="new-password" required minlength="6" maxlength="72" /></span>
          <span class="hint">Минимум 6 символов</span>
        </label>
        <div id="formError" class="error" role="alert"></div>
        <button class="btn block large" type="submit" id="submitBtn">Зарегистрироваться<svg class="i " aria-hidden="true"><use href="#i-arrow-right"></use></svg></button>
        <p class="auth-foot">Уже есть аккаунт? <a class="link" href="login.html">Войти</a></p>
      </form>
    </div>
  </main>

  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    if (params.get("role") === "master") document.getElementById("roleMaster").checked = true;

    document.getElementById("registerForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById("formError");
      const button = document.getElementById("submitBtn");
      const role = document.querySelector('input[name="role"]:checked').value;
      errorBox.textContent = "";
      button.disabled = true;
      try {
        const { access_token } = await api.register({
          name: document.getElementById("name").value,
          phone: document.getElementById("phone").value,
          password: document.getElementById("password").value,
          role,
        });
        setToken(access_token);
        location.href = role === "master" ? "master-profile-edit.html?welcome=1" : safeNext(params.get("next"));
      } catch (e) {
        errorBox.textContent = "Не удалось зарегистрироваться: " + e.message;
        button.disabled = false;
      }
    });

    renderNav();
  </script>
</body>
</html>
