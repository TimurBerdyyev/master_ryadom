<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="reg.docTitle">Регистрация — Мастер рядом</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="logo" href="index.html"><span class="logo-mark"><svg class="i" aria-hidden="true"><use href="#i-wrench"></use></svg></span> Мастер рядом</a>
    <nav id="nav"></nav>
  </header>

  <main>
    <div class="auth-wrap reveal">
      <div class="auth-head">
        <div class="badge-icon"><svg class="i " aria-hidden="true"><use href="#i-sparkles"></use></svg></div>
        <h1 data-i18n="reg.title">Создать аккаунт</h1>
        <p data-i18n="reg.sub">Это займёт меньше минуты</p>
      </div>

      <form class="card" id="registerForm">
        <div class="role-picker" role="radiogroup" data-i18n-aria="reg.roleAria">
          <input type="radio" name="role" id="roleClient" value="client" checked />
          <label for="roleClient"><svg class="i " aria-hidden="true"><use href="#i-house"></use></svg><span data-i18n="reg.roleClient">Ищу мастера</span><small data-i18n="reg.roleClientS">Создаю заказы</small></label>
          <input type="radio" name="role" id="roleMaster" value="master" />
          <label for="roleMaster"><svg class="i " aria-hidden="true"><use href="#i-briefcase"></use></svg><span data-i18n="reg.roleMaster">Я мастер</span><small data-i18n="reg.roleMasterS">Получаю заказы</small><small id="trialHint" class="trial-hint" hidden></small></label>
        </div>
        <label>
          <span data-i18n="reg.name">Имя</span>
          <span class="input-icon"><svg class="i " aria-hidden="true"><use href="#i-user"></use></svg><input id="name" type="text" autocomplete="name" required maxlength="255" data-i18n-ph="reg.namePh" /></span>
        </label>
        <label>
          <span data-i18n="common.phone">Телефон</span>
          <span class="input-icon"><svg class="i " aria-hidden="true"><use href="#i-phone"></use></svg><input id="phone" type="tel" autocomplete="tel" placeholder="+996 700 000 000" required maxlength="32" /></span>
        </label>
        <label>
          <span data-i18n="login.password">Пароль</span>
          <span class="input-icon"><svg class="i " aria-hidden="true"><use href="#i-lock"></use></svg><input id="password" type="password" autocomplete="new-password" required minlength="6" maxlength="72" /></span>
          <span class="hint" data-i18n="reg.pwHint">Минимум 6 символов</span>
        </label>
        <div id="formError" class="error" role="alert"></div>
        <button class="btn block large" type="submit" id="submitBtn"><span data-i18n="reg.submit">Зарегистрироваться</span><svg class="i " aria-hidden="true"><use href="#i-arrow-right"></use></svg></button>
        <p class="auth-foot"><span data-i18n="reg.haveAccount">Уже есть аккаунт?</span> <a class="link" href="login.html" data-i18n="nav.login">Войти</a></p>
      </form>
    </div>
  </main>

  <script src="js/icons.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    if (params.get("role") === "master") document.getElementById("roleMaster").checked = true;

    api.publicConfig().then(cfg => {
      if (!cfg.subscriptions_enabled) return;
      const hint = document.getElementById("trialHint");
      hint.textContent = t("reg.trialHint");
      hint.hidden = false;
    }).catch(() => {});

    document.getElementById("registerForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById("formError");
      const button = document.getElementById("submitBtn");
      const role = document.querySelector('input[name="role"]:checked').value;
      errorBox.textContent = "";
      button.disabled = true;
      try {
        const { access_token } = await api.register({
          name: document.getElementById("name").value,
          phone: document.getElementById("phone").value,
          password: document.getElementById("password").value,
          role,
        });
        setToken(access_token);
        location.href = role === "master" ? "master-profile-edit.html?welcome=1" : safeNext(params.get("next"));
      } catch (e) {
        errorBox.textContent = t("reg.fail") + e.message;
        button.disabled = false;
      }
    });

    renderNav();
  </script>
</body>
</html>
