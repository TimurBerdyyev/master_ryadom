<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="search.docTitle">Поиск мастеров — Мастер рядом</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="logo" href="index.html"><span class="logo-mark"><svg class="i" aria-hidden="true"><use href="#i-wrench"></use></svg></span> Мастер рядом</a>
    <nav id="nav"></nav>
  </header>

  <main>
    <div class="page-head">
      <div>
        <h1 id="title" data-i18n="search.title">Все мастера</h1>
        <p class="muted" id="subtitle">&nbsp;</p>
      </div>
      <a class="btn accent" id="orderBtn" href="order.html"><svg class="i" aria-hidden="true"><use href="#i-plus"></use></svg><span data-i18n="nav.createOrder">Создать заказ</span></a>
    </div>

    <div class="chips" id="categoryChips" role="tablist" data-i18n-aria="search.catsAria"></div>

    <form class="filters" onsubmit="event.preventDefault(); applyFilters();">
      <div class="input-icon">
        <svg class="i" aria-hidden="true"><use href="#i-search"></use></svg>
        <input id="searchInput" type="search" maxlength="100" data-i18n-ph="search.ph" data-i18n-aria="search.aria" />
      </div>
      <select id="cityFilter" data-i18n-aria="common.city"></select>
      <select id="ratingFilter" data-i18n-aria="search.ratingAria">
        <option value="" data-i18n="search.anyRating">Любой рейтинг</option>
        <option value="4">★ 4.0+</option>
        <option value="4.5">★ 4.5+</option>
      </select>
      <select id="verifiedFilter" data-i18n-aria="search.verifiedAria">
        <option value="" data-i18n="search.allMasters">Все мастера</option>
        <option value="true" data-i18n="search.verifiedOnly">Проверенные</option>
      </select>
      <select id="sortFilter" data-i18n-aria="search.sortAria">
        <option value="rating" data-i18n="search.sortRating">По рейтингу</option>
        <option value="orders" data-i18n="search.sortOrders">По опыту</option>
      </select>
      <button class="btn" type="submit" data-i18n="search.submit">Найти</button>
    </form>

    <div id="masterList" class="master-list"></div>
  </main>

  <script src="js/icons.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    let categoryId = params.get("category_id") || "";
    let categories = [];

    document.getElementById("searchInput").value = params.get("q") || "";
    const cityReady = cityOptionsHtml(params.get("city") || "", "city.all")
      .then(html => { document.getElementById("cityFilter").innerHTML = html; })
      .catch(() => {});
    document.getElementById("cityFilter").addEventListener("change", applyFilters);

    function categoryName(id) {
      return categories.find(c => String(c.id) === String(id))?.name;
    }

    function renderChips() {
      const chip = (id, label, iconHtml, style = "") => `
        <button type="button" role="tab" class="chip ${String(id) === String(categoryId) ? "active" : ""}"
                style="${style}" onclick="pickCategory('${id}')">${iconHtml}${label}</button>`;
      document.getElementById("categoryChips").innerHTML = [chip("", esc(t("search.allCats")), icon("layout-grid"))]
        .concat(categories.map(c => chip(c.id, esc(catName(c.name)), categoryIcon(c.name), categoryStyle(c.name).style)))
        .join("");
    }

    function pickCategory(id) {
      categoryId = id;
      renderChips();
      applyFilters();
    }

    function applyFilters() {
      const q = document.getElementById("searchInput").value.trim();
      const city = document.getElementById("cityFilter").value.trim();
      const next = new URLSearchParams();
      if (categoryId) next.set("category_id", categoryId);
      if (q) next.set("q", q);
      if (city) next.set("city", city);
      history.replaceState(null, "", `?${next}`);
      loadMasters();
    }

    function masterCard(m) {
      const prices = m.services.map(s => s.price_from);
      const minPrice = prices.length ? Math.min(...prices) : null;
      const tags = [...new Set(m.services.map(s => s.title))].slice(0, 4);
      return `
        <a class="master-card" href="master.html?id=${m.id}">
          ${avatarHtml(m.user.name)}
          <div>
            <div class="name">${esc(m.user.name)} ${m.verified ? verifiedBadge() : ""}</div>
            <div class="meta">
              ${ratingHtml(m.rating)}
              <span>${icon("briefcase")}${plural(m.completed_orders, "p.orders")}</span>
              ${m.experience_years ? `<span>${icon("timer")}${t("search.exp", { years: plural(m.experience_years, "p.years") })}</span>` : ""}
              ${m.city ? `<span>${icon("map-pin")}${esc(cityName(m.city))}</span>` : ""}
            </div>
            ${m.description ? `<div class="desc">${esc(m.description)}</div>` : ""}
            ${tags.length ? `<div class="tags">${tags.map(tag => `<span class="tag">${esc(tag)}</span>`).join("")}</div>` : ""}
          </div>
          <div class="side">
            ${minPrice !== null ? `<div class="price-from">${priceFromHtml(minPrice)}</div>` : "<span></span>"}
            <span class="btn small secondary">${t("common.profile")} ${icon("arrow-right")}</span>
          </div>
        </a>`;
    }

    async function loadMasters() {
      const list = document.getElementById("masterList");
      list.classList.remove("reveal");
      list.innerHTML = skeletons(4, 132);

      const q = document.getElementById("searchInput").value.trim();
      const name = categoryName(categoryId);
      document.getElementById("title").textContent = q ? t("search.query", { q }) : (categoryId && name ? catName(name) : t("search.title"));
      document.getElementById("orderBtn").href = categoryId ? `order.html?category_id=${encodeURIComponent(categoryId)}` : "order.html";

      const query = { sort: document.getElementById("sortFilter").value };
      if (categoryId) query.category_id = categoryId;
      if (q) query.q = q;
      const verified = document.getElementById("verifiedFilter").value;
      if (verified) query.verified = verified;
      const minRating = document.getElementById("ratingFilter").value;
      if (minRating) query.min_rating = minRating;
      const city = document.getElementById("cityFilter").value.trim();
      if (city) query.city = city;

      try {
        const masters = await api.searchMasters(query);
        document.getElementById("subtitle").textContent = t("search.found", { count: plural(masters.length, "p.masters") });
        if (masters.length === 0) {
          const href = `order.html${categoryId ? `?category_id=${encodeURIComponent(categoryId)}` : ""}`;
          list.innerHTML = emptyState("search-x", t("search.emptyTitle"), t("search.emptyText"),
            `<a class="btn accent" href="${href}">${icon("plus")}${t("nav.createOrder")}</a>`);
          return;
        }
        list.classList.add("reveal");
        list.innerHTML = masters.map(masterCard).join("");
      } catch (e) {
        list.innerHTML = emptyState("triangle-alert", t("search.loadError"), esc(e.message));
      }
    }

    Promise.all([api.categories(), cityReady])
      .then(([c]) => { categories = c; renderChips(); loadMasters(); })
      .catch(() => loadMasters());
    renderNav();
  </script>
</body>
</html>
