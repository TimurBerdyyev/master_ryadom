<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="orders.docTitle">Мои заказы — Мастер рядом</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="logo" href="index.html"><span class="logo-mark"><svg class="i" aria-hidden="true"><use href="#i-wrench"></use></svg></span> Мастер рядом</a>
    <nav id="nav"></nav>
  </header>

  <main class="narrow">
    <div class="page-head">
      <div>
        <h1 id="title" data-i18n="nav.myOrders">Мои заказы</h1>
        <p class="muted" id="subtitle">&nbsp;</p>
      </div>
      <a class="btn accent" id="headerAction" href="order.html" hidden></a>
    </div>

    <div class="chips" role="tablist">
      <button class="chip active" data-tab="active" onclick="setTab('active')"><svg class="i" aria-hidden="true"><use href="#i-timer"></use></svg><span data-i18n="orders.tabActive">Активные</span> <span id="cnt-active"></span></button>
      <button class="chip" data-tab="done" onclick="setTab('done')"><svg class="i" aria-hidden="true"><use href="#i-circle-check"></use></svg><span data-i18n="orders.tabDone">Завершённые</span> <span id="cnt-done"></span></button>
      <button class="chip" data-tab="cancelled" onclick="setTab('cancelled')"><svg class="i" aria-hidden="true"><use href="#i-circle-x"></use></svg><span data-i18n="orders.tabCancelled">Отменённые</span> <span id="cnt-cancelled"></span></button>
    </div>

    <div id="list" class="stack"></div>
  </main>

  <script src="js/icons.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script>
    const loggedIn = requireLogin("orders.html");

    const TABS = {
      active: s => !["completed", "reviewed", "cancelled"].includes(s),
      done: s => ["completed", "reviewed"].includes(s),
      cancelled: s => s === "cancelled",
    };
    let tab = "active";
    let orders = [];
    let categories = {};
    let isMaster = false;

    function setTab(name) {
      tab = name;
      document.querySelectorAll(".chip[data-tab]").forEach(c => c.classList.toggle("active", c.dataset.tab === name));
      render();
    }

    function render() {
      for (const name of Object.keys(TABS)) {
        const n = orders.filter(o => TABS[name](o.status)).length;
        document.getElementById(`cnt-${name}`).textContent = n ? `· ${n}` : "";
      }
      const list = document.getElementById("list");
      const visible = orders.filter(o => TABS[tab](o.status));
      if (!visible.length) {
        list.classList.remove("reveal");
        list.innerHTML = isMaster
          ? emptyState("briefcase", t("orders.emptyTitle"), t("orders.emptyMaster"),
              `<a class="btn" href="feed.html">${icon("inbox")}${t("orders.seeNew")}</a>`)
          : emptyState("clipboard-list", t("orders.emptyTitle"), t("orders.emptyClient"),
              `<a class="btn accent" href="order.html">${icon("plus")}${t("nav.createOrder")}</a>`);
        return;
      }
      list.classList.add("reveal");
      list.innerHTML = visible.map(o => {
        const cat = categories[o.category_id] || "";
        const action = !isMaster && o.status === "offers_received" ? `<span class="btn small accent">${t("orders.chooseMaster")} ${icon("arrow-right")}</span>`
          : !isMaster && o.status === "completed" ? `<span class="btn small">${t("orders.leaveReview")} ${icon("arrow-right")}</span>` : "";
        const who = isMaster && o.client_contact ? `<span>${icon("user")}${esc(o.client_contact.name)}</span>`
          : !isMaster && o.master_contact ? `<span>${icon("briefcase")}${esc(o.master_contact.name)}</span>` : "";
        return `
          <a class="order-card" href="order-detail.html?id=${o.id}">
            <div class="top">
              <span class="title">${categoryBadge(cat)}${esc(cat ? catName(cat) : t("common.order"))}</span>
              <span class="num">#${o.id}</span>
              <span class="spacer"></span>
              ${statusPillHtml(o.status)}
            </div>
            <div class="desc">${esc(o.description.length > 180 ? o.description.slice(0, 180) + "…" : o.description)}</div>
            <div class="foot">
              ${o.city ? `<span>${icon("map-pin")}${esc(cityName(o.city))}</span>` : ""}
              <span>${icon("calendar")}${formatDate(o.created_at)}</span>
              ${o.price ? `<span>${icon("wallet")}<b>${formatPrice(o.price)}</b></span>` : ""}
              ${who}
              <span class="spacer"></span>
              ${action}
            </div>
          </a>`;
      }).join("");
    }

    async function load() {
      document.getElementById("list").innerHTML = skeletons(3, 150);
      try {
        const [me, list, cats] = await Promise.all([api.me(), api.myOrders(), api.categories()]);
        isMaster = me.role === "master";
        orders = list;
        categories = Object.fromEntries(cats.map(c => [c.id, c.name]));
        document.getElementById("title").textContent = isMaster ? t("nav.myJobs") : t("nav.myOrders");
        document.getElementById("subtitle").textContent = isMaster ? t("orders.subMaster") : t("orders.subClient");
        const action = document.getElementById("headerAction");
        action.innerHTML = isMaster ? `${icon("inbox")}${t("nav.feed")}` : `${icon("plus")}${t("orders.new")}`;
        action.href = isMaster ? "feed.html" : "order.html";
        action.className = isMaster ? "btn" : "btn accent";
        action.hidden = false;
        render();
      } catch (e) {
        document.getElementById("list").innerHTML = emptyState("triangle-alert", t("orders.loadError"), esc(e.message));
      }
    }

    if (loggedIn) load();
    renderNav();
  </script>
</body>
</html>
