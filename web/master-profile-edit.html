<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="edit.docTitle">Мой профиль мастера — Мастер рядом</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="logo" href="index.html"><span class="logo-mark"><svg class="i" aria-hidden="true"><use href="#i-wrench"></use></svg></span> Мастер рядом</a>
    <nav id="nav"></nav>
  </header>

  <main class="narrow">
    <div class="page-head">
      <div>
        <h1 data-i18n="edit.title">Мой профиль мастера</h1>
        <p class="muted" data-i18n="edit.sub">Эти данные видят клиенты в поиске. Заполните их, чтобы получать заказы.</p>
      </div>
      <a class="btn secondary" id="publicLink" href="#" hidden><svg class="i" aria-hidden="true"><use href="#i-eye"></use></svg><span data-i18n="edit.viewPublic">Как видят клиенты</span></a>
    </div>

    <div class="notice success" id="welcome" hidden style="margin-bottom:16px">
      <svg class="i" aria-hidden="true"><use href="#i-sparkles"></use></svg><span data-i18n="edit.welcome">Добро пожаловать!</span>
    </div>

    <form class="card reveal" id="profileForm" style="max-width:none">
      <h2 class="form-section-title"><svg class="i" aria-hidden="true"><use href="#i-user-round"></use></svg><span data-i18n="edit.about">О себе</span></h2>
      <label>
        <span data-i18n="edit.description">Описание</span>
        <textarea id="description" rows="3" maxlength="2000" data-i18n-ph="edit.descriptionPh"></textarea>
      </label>
      <div class="form-grid">
        <label>
          <span data-i18n="edit.experience">Опыт работы (лет)</span>
          <input id="experience_years" type="number" min="0" max="80" />
        </label>
        <label>
          <span data-i18n="common.city">Город</span>
          <span class="input-icon"><svg class="i" aria-hidden="true"><use href="#i-map-pin"></use></svg><input id="city" type="text" maxlength="255" data-i18n-ph="edit.cityPh" /></span>
        </label>
      </div>
      <label>
        <span data-i18n="edit.district">Район</span>
        <input id="district" type="text" maxlength="255" data-i18n-ph="edit.districtPh" />
      </label>
      <div id="profileError" class="error"></div>
      <button class="btn" type="submit"><svg class="i" aria-hidden="true"><use href="#i-check"></use></svg><span data-i18n="edit.save">Сохранить</span></button>
    </form>

    <div class="section-title" data-i18n="edit.servicesTitle">Мои услуги и цены</div>
    <div id="servicesList" class="card-box" style="padding-top:6px;padding-bottom:6px"></div>

    <form class="card" id="serviceForm" style="margin-top:16px;max-width:none">
      <h2 class="form-section-title"><svg class="i" aria-hidden="true"><use href="#i-plus"></use></svg><span data-i18n="edit.addService">Добавить услугу</span></h2>
      <label>
        <span data-i18n="neworder.category">Категория</span>
        <select id="serviceCategory" required></select>
      </label>
      <div class="form-grid">
        <label>
          <span data-i18n="edit.serviceName">Название услуги</span>
          <input id="serviceTitle" type="text" maxlength="255" data-i18n-ph="edit.serviceNamePh" required />
        </label>
        <label>
          <span data-i18n="edit.priceFrom">Цена от, сом</span>
          <input id="servicePrice" type="number" min="0" max="10000000" required />
        </label>
      </div>
      <div id="serviceError" class="error"></div>
      <button class="btn secondary" type="submit"><svg class="i" aria-hidden="true"><use href="#i-plus"></use></svg><span data-i18n="edit.addService">Добавить услугу</span></button>
    </form>

    <div class="section-title" data-i18n="edit.photosTitle">Фото работ</div>
    <div id="photosGrid" class="photo-grid"></div>
    <label class="btn secondary" style="cursor:pointer;">
      <svg class="i" aria-hidden="true"><use href="#i-image-plus"></use></svg><span data-i18n="edit.addPhoto">Добавить фото</span>
      <input id="photoInput" type="file" accept="image/jpeg,image/png,image/webp" multiple style="display:none" />
    </label>
    <div id="photoError" class="error"></div>
  </main>

  <script src="js/icons.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script>
    const loggedIn = requireLogin("master-profile-edit.html");
    if (new URLSearchParams(location.search).get("welcome")) document.getElementById("welcome").hidden = false;

    let categories = [];

    async function loadProfile() {
      try {
        const master = await api.myMasterProfile();
        document.getElementById("description").value = master.description || "";
        document.getElementById("experience_years").value = master.experience_years || "";
        document.getElementById("city").value = master.city || "";
        document.getElementById("district").value = master.district || "";
        renderServices(master.services);
        const link = document.getElementById("publicLink");
        link.href = `master.html?id=${master.id}`;
        link.hidden = false;
        renderPhotos(master.photos);
      } catch (e) {
        document.getElementById("profileError").textContent = t("edit.loadError") + e.message;
      }
    }

    function renderServices(services) {
      const list = document.getElementById("servicesList");
      if (!services.length) {
        list.innerHTML = `<p class="muted" style="margin:14px 0">${t("edit.noServices")}</p>`;
        return;
      }
      list.innerHTML = services.map(s => {
        const cat = categories.find(c => c.id === s.category_id)?.name || "";
        return `
        <div class="service-row" style="align-items:center">
          <div class="row" style="flex-wrap:nowrap;gap:12px">
            ${categoryBadge(cat)}
            <div>
              <div style="font-weight:600">${esc(s.title)}</div>
              <div class="muted" style="font-size:13px">${esc(catName(cat))}</div>
            </div>
          </div>
          <div class="row">
            <span class="price">${priceFrom(s.price_from)}</span>
            <button class="btn small secondary" onclick="removeService(${s.id})" aria-label="${t("edit.deleteService")}">${icon("trash-2")}</button>
          </div>
        </div>`;
      }).join("");
    }

    function renderPhotos(photos) {
      const grid = document.getElementById("photosGrid");
      grid.innerHTML = photos.map(p => `
        <div class="photo-thumb-wrap">
          <img class="photo-thumb" src="${esc(uploadUrl(p.url))}" alt="${t("master.photoAlt")}" />
          <button class="remove-btn" onclick="removePhoto(${p.id})" title="${t("common.delete")}" aria-label="${t("edit.deletePhoto")}">${icon("x", "sm")}</button>
        </div>
      `).join("");
    }

    async function removePhoto(id) {
      try {
        await api.deleteMyPhoto(id);
        loadProfile();
      } catch (e) {
        toast(t("edit.photoDeleteError") + e.message);
      }
    }

    document.getElementById("photoInput").addEventListener("change", async (e) => {
      const files = Array.from(e.target.files || []);
      if (!files.length) return;
      const errorBox = document.getElementById("photoError");
      errorBox.textContent = "";
      try {
        await api.uploadMyPhotos(files);
        e.target.value = "";
        loadProfile();
      } catch (err) {
        errorBox.textContent = t("edit.photoUploadError") + err.message;
      }
    });

    async function removeService(id) {
      try {
        await api.deleteMyService(id);
        loadProfile();
      } catch (e) {
        toast(t("edit.serviceDeleteError") + e.message);
      }
    }

    async function loadCategories() {
      categories = await api.categories();
      document.getElementById("serviceCategory").innerHTML =
        categories.map(c => `<option value="${c.id}">${esc(catName(c.name))}</option>`).join("");
    }

    document.getElementById("profileForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById("profileError");
      errorBox.textContent = "";
      try {
        await api.updateMasterProfile({
          description: document.getElementById("description").value || null,
          experience_years: document.getElementById("experience_years").value ? Number(document.getElementById("experience_years").value) : null,
          city: document.getElementById("city").value || null,
          district: document.getElementById("district").value || null,
        });
        toast(t("edit.saved"));
      } catch (e) {
        errorBox.textContent = t("edit.saveError") + e.message;
      }
    });

    document.getElementById("serviceForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById("serviceError");
      errorBox.textContent = "";
      try {
        await api.addMyService({
          category_id: Number(document.getElementById("serviceCategory").value),
          title: document.getElementById("serviceTitle").value,
          price_from: Number(document.getElementById("servicePrice").value),
        });
        document.getElementById("serviceTitle").value = "";
        document.getElementById("servicePrice").value = "";
        toast(t("edit.serviceAdded"));
        loadProfile();
      } catch (e) {
        errorBox.textContent = t("edit.serviceAddError") + e.message;
      }
    });

    async function init() {
      const me = await api.me();
      if (me.role !== "master") {
        document.querySelector("main").innerHTML = emptyState("briefcase", t("feed.onlyMasters"), t("edit.clientOnly"),
          `<a class="btn" href="orders.html">${t("nav.myOrders")}</a>`);
        return;
      }
      await loadCategories().catch(() => {});
      loadProfile();
    }

    if (loggedIn) init().catch(e => toast(t("common.error") + e.message));
    renderNav();
  </script>
</body>
</html>
