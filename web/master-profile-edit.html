<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Мой профиль мастера — Мастер рядом</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="logo" href="index.html">🔧 Мастер рядом</a>
    <nav id="nav"></nav>
  </header>

  <main>
    <h1>Мой профиль мастера</h1>
    <p class="muted">Эти данные видят клиенты в поиске. Заполните их, чтобы получать заказы.</p>

    <form class="card" id="profileForm">
      <label>
        О себе
        <textarea id="description" rows="3" placeholder="Например: опытный сантехник, работаю быстро и аккуратно"></textarea>
      </label>
      <label>
        Опыт работы (лет)
        <input id="experience_years" type="number" min="0" />
      </label>
      <label>
        Город
        <input id="city" type="text" placeholder="Бишкек" />
      </label>
      <label>
        Район
        <input id="district" type="text" placeholder="Центр" />
      </label>
      <div id="profileError" class="error"></div>
      <button class="btn" type="submit">Сохранить</button>
    </form>

    <div class="section-title">Мои услуги и цены</div>
    <div id="servicesList" class="master-list"></div>

    <form class="card" id="serviceForm" style="margin-top:16px">
      <label>
        Категория
        <select id="serviceCategory" required></select>
      </label>
      <label>
        Название услуги
        <input id="serviceTitle" type="text" placeholder="Например: замена смесителя" required />
      </label>
      <label>
        Цена от (сом)
        <input id="servicePrice" type="number" min="0" required />
      </label>
      <div id="serviceError" class="error"></div>
      <button class="btn secondary" type="submit">Добавить услугу</button>
    </form>
  </main>

  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script>
    if (!getToken()) {
      location.href = `login.html?next=${encodeURIComponent(location.pathname)}`;
    }

    let categories = [];

    async function loadProfile() {
      try {
        const master = await api.myMasterProfile();
        document.getElementById("description").value = master.description || "";
        document.getElementById("experience_years").value = master.experience_years || "";
        document.getElementById("city").value = master.city || "";
        document.getElementById("district").value = master.district || "";
        renderServices(master.services);
      } catch (e) {
        document.getElementById("profileError").textContent = "Не удалось загрузить профиль: " + e.message;
      }
    }

    function renderServices(services) {
      const list = document.getElementById("servicesList");
      if (!services.length) {
        list.innerHTML = `<p class="muted">Вы пока не добавили ни одной услуги — без них клиенты не найдут вас в категории.</p>`;
        return;
      }
      list.innerHTML = services.map(s => `
        <div class="master-card" style="align-items:center">
          <div class="info">
            <div class="name">${s.title}</div>
            <div class="meta">от ${s.price_from} сом</div>
          </div>
          <button class="btn secondary" onclick="removeService(${s.id})">Удалить</button>
        </div>
      `).join("");
    }

    async function removeService(id) {
      try {
        await api.deleteMyService(id);
        loadProfile();
      } catch (e) {
        alert("Не удалось удалить услугу: " + e.message);
      }
    }

    async function loadCategories() {
      categories = await api.categories();
      document.getElementById("serviceCategory").innerHTML =
        categories.map(c => `<option value="${c.id}">${c.name}</option>`).join("");
    }

    document.getElementById("profileForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById("profileError");
      errorBox.textContent = "";
      try {
        await api.updateMasterProfile({
          description: document.getElementById("description").value || null,
          experience_years: document.getElementById("experience_years").value ? Number(document.getElementById("experience_years").value) : null,
          city: document.getElementById("city").value || null,
          district: document.getElementById("district").value || null,
        });
        errorBox.textContent = "";
        errorBox.classList.remove("error");
        errorBox.classList.add("muted");
        errorBox.textContent = "Сохранено ✓";
      } catch (e) {
        errorBox.classList.remove("muted");
        errorBox.classList.add("error");
        errorBox.textContent = "Не удалось сохранить: " + e.message;
      }
    });

    document.getElementById("serviceForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById("serviceError");
      errorBox.textContent = "";
      try {
        await api.addMyService({
          category_id: Number(document.getElementById("serviceCategory").value),
          title: document.getElementById("serviceTitle").value,
          price_from: Number(document.getElementById("servicePrice").value),
        });
        document.getElementById("serviceTitle").value = "";
        document.getElementById("servicePrice").value = "";
        loadProfile();
      } catch (e) {
        errorBox.textContent = "Не удалось добавить услугу: " + e.message;
      }
    });

    loadCategories();
    loadProfile();
    renderNav();
  </script>
</body>
</html>
