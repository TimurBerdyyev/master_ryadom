<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="success.docTitle">Заявка отправлена — Мастер рядом</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="logo" href="index.html"><span class="logo-mark"><svg class="i" aria-hidden="true"><use href="#i-wrench"></use></svg></span> Мастер рядом</a>
    <nav id="nav"></nav>
  </header>

  <main class="narrow">
    <div class="card-box success-hero reveal">
      <div class="check"><svg class="i" aria-hidden="true"><use href="#i-check"></use></svg></div>
      <h1 data-i18n="success.title">Заявка отправлена</h1>
      <p class="muted" style="font-size:16px;max-width:460px;margin:0 auto" id="successText"></p>
      <p class="error" id="photoError"></p>
      <div class="row" style="justify-content:center;margin-top:28px">
        <a class="btn large" id="orderLink" href="orders.html"><span data-i18n="success.open">Открыть заказ</span><svg class="i" aria-hidden="true"><use href="#i-arrow-right"></use></svg></a>
        <a class="btn secondary large" href="index.html" data-i18n="success.home">На главную</a>
      </div>
    </div>
  </main>

  <script src="js/icons.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const id = params.get("id");
    const validId = /^\d+$/.test(id || "");
    // id is digits-only here, so it is safe inside the translated markup
    document.getElementById("successText").innerHTML = t("success.text", { id: validId ? "#" + id : "" });
    if (validId) document.getElementById("orderLink").href = `order-detail.html?id=${id}`;
    if (params.get("photo_error")) {
      document.getElementById("photoError").textContent = t("success.photoError");
    }
    renderNav();
  </script>
</body>
</html>
