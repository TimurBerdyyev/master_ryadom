<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Заказ — Мастер рядом</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="logo" href="index.html"><span class="logo-mark"><svg class="i" aria-hidden="true"><use href="#i-wrench"></use></svg></span> Мастер рядом</a>
    <nav id="nav"></nav>
  </header>

  <main class="narrow" id="content">
    <div class="skeleton" style="height:280px;margin-bottom:16px"></div>
    <div class="skeleton" style="height:160px"></div>
  </main>

  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script>
    const orderId = new URLSearchParams(location.search).get("id");
    const loggedIn = requireLogin(`order-detail.html?id=${encodeURIComponent(orderId || "")}`);

    const PROGRESS = [
      ["searching", "Поиск"],
      ["master_selected", "Мастер выбран"],
      ["master_confirmed", "Подтвердил"],
      ["master_en_route", "В пути"],
      ["in_progress", "В работе"],
      ["completed", "Готово"],
    ];
    const PROGRESS_INDEX = { created: 0, searching: 0, offers_received: 0, reviewed: 5 };
    PROGRESS.forEach(([s], i) => { if (!(s in PROGRESS_INDEX)) PROGRESS_INDEX[s] = i; });

    // Next steps the assigned master can report.
    const MASTER_NEXT = {
      master_selected: [["master_confirmed", "Подтвердить заказ", "circle-check"]],
      master_confirmed: [["master_en_route", "Я выехал", "car"], ["in_progress", "Начал работу", "hammer"]],
      master_en_route: [["in_progress", "Начал работу", "hammer"]],
      in_progress: [["completed", "Работа выполнена", "circle-check"]],
    };

    let me, order, offers, categoryName;
    let reviewRating = 5;

    function stepperHtml(status) {
      if (status === "cancelled") return "";
      const idx = PROGRESS_INDEX[status] ?? 0;
      return `<div class="stepper" aria-label="Этап заказа">${PROGRESS.map(([, label], i) => `
        <div class="st ${i <= idx ? "done" : ""} ${i === idx ? "current" : ""}">
          <span class="dot">${i <= idx ? icon("check") : ""}</span>${label}
        </div>`).join("")}</div>`;
    }

    function metaTile(iconName, label, value) {
      return `<div class="meta-tile">${icon(iconName)}<div><small>${label}</small><b>${value}</b></div></div>`;
    }

    function contactHtml(contact, title, profileHref) {
      return `
        <div class="contact-box">
          ${avatarHtml(contact.name)}
          <div style="flex:1;min-width:160px">
            <div class="muted" style="font-size:13px">${title}</div>
            <div style="font-weight:700;font-size:17px">${esc(contact.name)}</div>
            <div class="muted">${esc(contact.phone)}</div>
          </div>
          <div class="row">
            ${profileHref ? `<a class="btn small secondary" href="${profileHref}">${icon("user")}Профиль</a>` : ""}
            <a class="btn small secondary" href="${esc(telLink(contact.phone))}">${icon("phone")}Позвонить</a>
            <a class="btn small whatsapp" href="${esc(waLink(contact.phone))}" target="_blank" rel="noopener noreferrer">${icon("message-circle")}WhatsApp</a>
          </div>
        </div>`;
    }

    function offersHtml() {
      const isOwner = order.client_id === me.id;
      const canAccept = isOwner && ["searching", "offers_received"].includes(order.status);
      if (!offers.length) {
        return canAccept
          ? `<div style="margin-top:16px">${emptyState("timer", "Ждём предложения мастеров",
              "Мастера этой категории уже видят заказ. Мы пришлём уведомление, как только кто-то предложит цену.")}</div>`
          : "";
      }
      return `
        <div class="section-title">${isOwner ? `Предложения мастеров <span class="muted" style="font-family:var(--font-text);font-weight:500">· ${offers.length}</span>` : "Ваше предложение"}</div>
        <div class="stack reveal">
          ${offers.map((o, i) => `
            <div class="offer-card ${o.status}">
              ${avatarHtml(o.master.name)}
              <div style="flex:1;min-width:180px">
                <div class="row" style="gap:8px">
                  <a href="master.html?id=${o.master.id}" style="font-weight:700;font-size:16px">${esc(o.master.name)}</a>
                  ${o.master.verified ? verifiedBadge() : ""}
                  ${canAccept && i === 0 && offers.length > 1 ? '<span class="status-pill info">Лучшая цена</span>' : ""}
                </div>
                <div class="meta">${ratingHtml(o.master.rating)}<span>${icon("briefcase")}${o.master.completed_orders} ${pluralize(o.master.completed_orders, "заказ", "заказа", "заказов")}</span></div>
                ${o.comment ? `<div class="comment">${esc(o.comment)}</div>` : ""}
              </div>
              <div class="offer-side">
                <div class="price">${formatPrice(o.price)}</div>
                ${canAccept && o.status === "pending"
                  ? `<button class="btn small success" onclick="accept(${o.id}, ${o.price})">${icon("check")}Выбрать</button>`
                  : o.status === "accepted" ? '<span class="status-pill ok">Выбран</span>'
                  : o.status === "rejected" ? '<span class="status-pill">Не выбран</span>' : '<span class="status-pill info">Ожидает ответа</span>'}
              </div>
            </div>`).join("")}
        </div>`;
    }

    function actionsHtml() {
      const isOwner = order.client_id === me.id;
      const isAssigned = !isOwner && order.client_contact;
      const parts = [];

      if (isAssigned && MASTER_NEXT[order.status]) {
        parts.push(`
          <div class="card-box">
            <h2 class="form-section-title">${icon("refresh-cw")}Обновите статус</h2>
            <p class="muted" style="margin:6px 0 16px">Клиент получит уведомление.</p>
            <div class="row">${MASTER_NEXT[order.status].map(([s, label, ic], i) =>
              `<button class="btn ${i ? "secondary" : ""}" onclick="setStatus('${s}')">${icon(ic)}${label}</button>`).join("")}</div>
          </div>`);
      }

      if (isOwner && ["master_confirmed", "master_en_route", "in_progress"].includes(order.status)) {
        parts.push(`
          <div class="card-box row">
            <div style="flex:1;min-width:200px"><b>Мастер закончил работу?</b><div class="muted">Подтвердите — и сможете оставить отзыв.</div></div>
            <button class="btn success" onclick="setStatus('completed')">${icon("circle-check")}Работа выполнена</button>
          </div>`);
      }

      if (isOwner && order.status === "completed") {
        parts.push(`
          <form class="card" id="reviewForm" style="max-width:none" onsubmit="event.preventDefault(); sendReview();">
            <h2 class="form-section-title">${icon("thumbs-up")}Оцените работу мастера</h2>
            <div class="star-input" id="starInput" role="radiogroup" aria-label="Оценка">${[1, 2, 3, 4, 5].map(n =>
              `<button type="button" data-n="${n}" aria-label="${n} из 5" onclick="setRating(${n})">${icon("star")}</button>`).join("")}</div>
            <label>Отзыв (необязательно)
              <textarea id="reviewText" rows="3" maxlength="2000" placeholder="Что понравилось, что можно улучшить"></textarea>
            </label>
            <div class="error" id="reviewError"></div>
            <button class="btn" type="submit">${icon("send")}Отправить отзыв</button>
          </form>`);
      }

      const cancellable = isOwner && !["completed", "reviewed", "cancelled"].includes(order.status);
      parts.push(`
        <div class="row" style="justify-content:flex-end">
          <button class="btn small ghost" onclick="toggleComplaint()">${icon("flag")}Пожаловаться</button>
          ${cancellable ? `<button class="btn small secondary" onclick="cancelOrder()">${icon("circle-x")}Отменить заказ</button>` : ""}
        </div>
        <form class="card" id="complaintForm" hidden style="max-width:none" onsubmit="event.preventDefault(); sendComplaint();">
          <h2 class="form-section-title">${icon("flag")}Жалоба администратору</h2>
          <label>Опишите проблему
            <textarea id="complaintText" rows="3" maxlength="2000" required></textarea>
          </label>
          <div class="error" id="complaintError"></div>
          <button class="btn danger" type="submit">Отправить жалобу</button>
        </form>`);
      return parts.join("");
    }

    function render() {
      const isOwner = order.client_id === me.id;
      const tiles = [
        order.date ? metaTile("calendar", "Когда", `${formatDate(order.date)}${order.time ? ", " + esc(order.time) : ""}`) : "",
        order.address ? metaTile("map-pin", "Адрес", esc(order.address)) : "",
        order.price ? metaTile("wallet", order.master_id ? "Цена" : "Бюджет", formatPrice(order.price)) : "",
        metaTile("clock", "Создан", formatDate(order.created_at, true)),
      ].join("");

      document.getElementById("content").innerHTML = `
        <a class="back-link" href="orders.html">${icon("arrow-left", "sm")}${isOwner ? "Мои заказы" : "Мои работы"}</a>
        <div class="card-box">
          <div class="row" style="gap:14px">
            ${categoryBadge(categoryName, "cat-dot lg")}
            <div style="flex:1;min-width:150px">
              <h1 style="margin:0;font-size:22px;overflow-wrap:anywhere">${esc(categoryName)}</h1>
              <div class="muted">Заказ #${order.id}</div>
            </div>
            ${statusPillHtml(order.status)}
          </div>
          ${stepperHtml(order.status)}
          <p style="white-space:pre-wrap;margin:22px 0 0;font-size:16px">${esc(order.description)}</p>
          <div class="order-meta-grid">${tiles}</div>
          ${order.photos.length ? `<div class="photo-grid" style="margin:16px 0 0">${order.photos.map(p =>
            `<a href="${esc(uploadUrl(p.url))}" target="_blank" rel="noopener"><img class="photo-thumb" src="${esc(uploadUrl(p.url))}" alt="Фото к заказу" loading="lazy" /></a>`).join("")}</div>` : ""}
        </div>

        ${order.master_contact ? `<div style="margin-top:16px">${contactHtml(order.master_contact, "Ваш мастер", `master.html?id=${order.master_id}`)}</div>` : ""}
        ${order.client_contact ? `<div style="margin-top:16px">${contactHtml(order.client_contact, "Клиент", null)}</div>` : ""}

        ${offersHtml()}
        <div class="stack" style="margin-top:16px">${actionsHtml()}</div>
      `;
      if (document.getElementById("starInput")) setRating(reviewRating);
    }

    async function load() {
      if (!/^\d+$/.test(orderId || "")) {
        document.getElementById("content").innerHTML = emptyState("search-x", "Заказ не найден", "",
          `<a class="btn" href="orders.html">К заказам</a>`);
        return;
      }
      try {
        const [user, o, cats] = await Promise.all([api.me(), api.getOrder(orderId), api.categories()]);
        me = user;
        order = o;
        categoryName = cats.find(c => c.id === o.category_id)?.name || "Заказ";
        offers = await api.orderOffers(orderId);
        render();
      } catch (e) {
        document.getElementById("content").innerHTML = emptyState("lock", esc(e.message), "",
          `<a class="btn" href="orders.html">К заказам</a>`);
      }
    }

    async function run(action, successMessage) {
      try {
        await action();
        toast(successMessage);
        await load();
        refreshUnread();
      } catch (e) {
        toast("Ошибка: " + e.message);
      }
    }

    function accept(offerId, price) {
      if (!confirm(`Выбрать этого мастера за ${formatPrice(price)}? Остальные предложения будут отклонены.`)) return;
      run(() => api.acceptOffer(orderId, offerId), "Мастер выбран — свяжитесь с ним");
    }

    function setStatus(status) {
      run(() => api.setOrderStatus(orderId, status), "Статус обновлён");
    }

    function cancelOrder() {
      if (!confirm("Отменить заказ?")) return;
      run(() => api.cancelOrder(orderId), "Заказ отменён");
    }

    function setRating(n) {
      reviewRating = n;
      document.querySelectorAll("#starInput button").forEach(b => b.classList.toggle("on", Number(b.dataset.n) <= n));
    }

    async function sendReview() {
      try {
        await api.leaveReview(orderId, { rating: reviewRating, text: document.getElementById("reviewText").value.trim() || null });
        toast("Спасибо за отзыв!");
        load();
      } catch (e) {
        document.getElementById("reviewError").textContent = e.message;
      }
    }

    function toggleComplaint() {
      const form = document.getElementById("complaintForm");
      form.hidden = !form.hidden;
    }

    async function sendComplaint() {
      try {
        await api.fileComplaint({ text: document.getElementById("complaintText").value.trim(), order_id: Number(orderId) });
        toast("Жалоба отправлена администратору");
        document.getElementById("complaintForm").hidden = true;
      } catch (e) {
        document.getElementById("complaintError").textContent = e.message;
      }
    }

    if (loggedIn) load();
    renderNav();
  </script>
</body>
</html>
