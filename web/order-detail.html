<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title data-i18n="detail.docTitle">Заказ — Мастер рядом</title>
  <meta name="robots" content="noindex" />
  <meta name="referrer" content="no-referrer" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Мастер рядом" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="logo" href="index.html"><span class="logo-mark"><svg class="i" aria-hidden="true"><use href="#i-wrench"></use></svg></span> Мастер рядом</a>
    <nav id="nav"></nav>
  </header>

  <main class="narrow" id="content">
    <div class="skeleton" style="height:280px;margin-bottom:16px"></div>
    <div class="skeleton" style="height:160px"></div>
  </main>

  <script src="js/icons.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script>
    // Two ways in: a client opens their request by its private link (#token=...), no account;
    // the chosen master (or an admin) opens the job by id while logged in.
    const token = tokenFromUrl();
    const orderId = token ? null : new URLSearchParams(location.search).get("id");
    const isClient = Boolean(token);
    const loggedIn = isClient || requireLogin(`order-detail.html?id=${encodeURIComponent(orderId || "")}`);
    const backHref = isClient ? "my-requests.html" : "orders.html";
    const OPEN = ["searching", "offers_received"];

    const PROGRESS = [
      ["searching", t("detail.stSearch")],
      ["master_selected", t("detail.stSelected")],
      ["master_confirmed", t("detail.stConfirmed")],
      ["master_en_route", t("detail.stRoute")],
      ["in_progress", t("detail.stWork")],
      ["completed", t("detail.stDone")],
    ];
    const PROGRESS_INDEX = { created: 0, searching: 0, offers_received: 0, reviewed: 5 };
    PROGRESS.forEach(([s], i) => { if (!(s in PROGRESS_INDEX)) PROGRESS_INDEX[s] = i; });

    // Next steps the assigned master can report.
    const MASTER_NEXT = {
      master_selected: [["master_confirmed", t("detail.confirmOrder"), "circle-check"]],
      master_confirmed: [["master_en_route", t("detail.onMyWay"), "car"], ["in_progress", t("detail.startWork"), "hammer"]],
      master_en_route: [["in_progress", t("detail.startWork"), "hammer"]],
      in_progress: [["completed", t("detail.workDone"), "circle-check"]],
    };

    let order, offers, categoryName;
    let reviewRating = 5;

    function stepperHtml(status) {
      if (status === "cancelled") return "";
      const idx = PROGRESS_INDEX[status] ?? 0;
      return `<div class="stepper" aria-label="${t("detail.stageAria")}">${PROGRESS.map(([, label], i) => `
        <div class="st ${i <= idx ? "done" : ""} ${i === idx ? "current" : ""}">
          <span class="dot">${i <= idx ? icon("check") : ""}</span>${label}
        </div>`).join("")}</div>`;
    }

    function metaTile(iconName, label, value) {
      return `<div class="meta-tile">${icon(iconName)}<div><small>${label}</small><b>${value}</b></div></div>`;
    }

    function callButtons(phone) {
      return `
        <a class="btn small secondary" href="${esc(telLink(phone))}">${icon("phone")}${t("common.call")}</a>
        <a class="btn small whatsapp" href="${esc(waLink(phone))}" target="_blank" rel="noopener noreferrer">${icon("message-circle")}WhatsApp</a>`;
    }

    function contactHtml(contact, title, profileHref, photo, note) {
      return `
        <div class="contact-box">
          ${avatarHtml(contact.name, "avatar", photo)}
          <div style="flex:1;min-width:160px">
            <div class="muted" style="font-size:13px">${title}</div>
            <div style="font-weight:700;font-size:17px">${esc(contact.name)}</div>
            <div class="muted">${esc(contact.phone)}</div>
            ${note ? `<div class="muted" style="font-size:13px;margin-top:4px">${note}</div>` : ""}
          </div>
          <div class="row">
            ${profileHref ? `<a class="btn small secondary" href="${profileHref}">${icon("user")}${t("common.profile")}</a>` : ""}
            ${callButtons(contact.phone)}
          </div>
        </div>`;
    }

    // The 20-minute promise: a ring that empties while masters answer, then "we're on it".
    function promiseHtml() {
      if (!isClient || order.status !== "searching") return "";
      const total = 20 * 60;
      const left = secondsLeft(order.response_deadline);
      if (left <= 0) {
        return `
          <div class="promise-box over" style="margin-top:16px">
            <div class="promise-clock"><span>${icon("phone-call", "lg")}</span></div>
            <div><h3>${t("detail.overdueTitle")}</h3><p>${t("detail.overdueText", { phone: esc(order.client_phone || "") })}</p></div>
          </div>`;
      }
      return `
        <div class="promise-box" style="margin-top:16px">
          <div class="promise-clock" id="promiseClock" style="--p:${Math.min(1, left / total)}"><span id="promiseTime">${formatCountdown(left)}</span></div>
          <div><h3>${t("detail.waitTitle")}</h3><p>${t("detail.waitText")}</p><p class="muted" style="margin-top:6px">${t("detail.promise")}</p></div>
        </div>`;
    }

    function offersHtml() {
      const canAccept = isClient && OPEN.includes(order.status);
      if (!offers.length) return "";
      return `
        <div class="section-title">${isClient ? `${t("detail.offersTitle")} <span class="muted" style="font-family:var(--font-text);font-weight:500">· ${offers.length}</span>` : t("detail.yourOffer")}</div>
        <div class="stack reveal">
          ${offers.map((o, i) => `
            <div class="offer-card ${o.status}">
              ${avatarHtml(o.master.name, "avatar", o.master.photo)}
              <div style="flex:1;min-width:180px">
                <div class="row" style="gap:8px">
                  <a href="master.html?id=${o.master.id}" style="font-weight:700;font-size:16px">${esc(o.master.name)}</a>
                  ${o.master.verified ? verifiedBadge() : ""}
                  ${canAccept && i === 0 && offers.length > 1 ? `<span class="status-pill info">${t("detail.bestPrice")}</span>` : ""}
                </div>
                <div class="meta">${ratingHtml(o.master.rating)}<span>${icon("briefcase")}${plural(o.master.completed_orders, "p.orders")}</span></div>
                ${o.comment ? `<div class="comment">${esc(o.comment)}</div>` : ""}
                ${canAccept && o.master.phone ? `<div class="row" style="margin-top:10px">${callButtons(o.master.phone)}</div>` : ""}
              </div>
              <div class="offer-side">
                <div class="price">${formatPrice(o.price)}</div>
                ${canAccept && o.status === "pending"
                  ? `<button class="btn small success" onclick="accept(${o.id}, ${o.price})">${icon("check")}${t("detail.choose")}</button>`
                  : o.status === "accepted" ? `<span class="status-pill ok">${t("detail.chosen")}</span>`
                  : o.status === "rejected" ? `<span class="status-pill">${t("detail.notChosen")}</span>` : `<span class="status-pill info">${t("detail.awaiting")}</span>`}
              </div>
            </div>`).join("")}
        </div>`;
    }

    function actionsHtml() {
      const isAssigned = !isClient && order.client_contact;
      const parts = [];

      if (isAssigned && MASTER_NEXT[order.status]) {
        parts.push(`
          <div class="card-box">
            <h2 class="form-section-title">${icon("refresh-cw")}${t("detail.updateStatus")}</h2>
            <div class="row" style="margin-top:16px">${MASTER_NEXT[order.status].map(([s, label, ic], i) =>
              `<button class="btn ${i ? "secondary" : ""}" onclick="setStatus('${s}')">${icon(ic)}${label}</button>`).join("")}</div>
          </div>`);
      }

      if (isClient && ["master_confirmed", "master_en_route", "in_progress"].includes(order.status)) {
        parts.push(`
          <div class="card-box row">
            <div style="flex:1;min-width:200px"><b>${t("detail.doneQ")}</b><div class="muted">${t("detail.doneText")}</div></div>
            <button class="btn success" onclick="complete()">${icon("circle-check")}${t("detail.workDone")}</button>
          </div>`);
      }

      if (isClient && order.status === "completed") {
        parts.push(`
          <form class="card" id="reviewForm" style="max-width:none" onsubmit="event.preventDefault(); sendReview();">
            <h2 class="form-section-title">${icon("thumbs-up")}${t("detail.rateTitle")}</h2>
            <div class="star-input" id="starInput" role="radiogroup" aria-label="${t("detail.ratingAria")}">${[1, 2, 3, 4, 5].map(n =>
              `<button type="button" data-n="${n}" aria-label="${t("detail.nOf5", { n })}" onclick="setRating(${n})">${icon("star")}</button>`).join("")}</div>
            <label>${t("detail.reviewLabel")}
              <textarea id="reviewText" rows="3" maxlength="2000" placeholder="${t("detail.reviewPh")}"></textarea>
            </label>
            <div class="error" id="reviewError"></div>
            <button class="btn" type="submit">${icon("send")}${t("detail.sendReview")}</button>
          </form>`);
      }

      if (isClient) {
        const link = requestLink(token);
        parts.push(`
          <div class="card-box">
            <h2 class="form-section-title">${icon("link")}${t("detail.linkTitle")}</h2>
            <p class="muted" style="margin:6px 0 12px">${t("detail.linkText")}</p>
            <div class="link-box">
              <input type="text" readonly value="${esc(link)}" aria-label="${t("detail.linkTitle")}" />
              <button class="btn secondary" type="button" data-copy="${esc(link)}">${icon("copy")}${t("common.copy")}</button>
            </div>
          </div>`);
        const cancellable = !["completed", "reviewed", "cancelled"].includes(order.status);
        parts.push(`
          <div class="row" style="justify-content:flex-end">
            <button class="btn small ghost" onclick="toggleComplaint()">${icon("flag")}${t("detail.report")}</button>
            ${cancellable ? `<button class="btn small secondary" onclick="cancelRequest()">${icon("circle-x")}${t("detail.cancel")}</button>` : ""}
          </div>
          <form class="card" id="complaintForm" hidden style="max-width:none" onsubmit="event.preventDefault(); sendComplaint();">
            <h2 class="form-section-title">${icon("flag")}${t("detail.reportTitle")}</h2>
            <label>${t("detail.reportLabel")}
              <textarea id="complaintText" rows="3" maxlength="2000" required></textarea>
            </label>
            <div class="error" id="complaintError"></div>
            <button class="btn danger" type="submit">${t("detail.sendReport")}</button>
          </form>`);
      }
      return parts.join("");
    }

    function render() {
      const tiles = [
        order.date ? metaTile("calendar", t("detail.when"), `${formatDate(order.date)}${order.time ? ", " + esc(order.time) : ""}`) : "",
        order.city ? metaTile("map-pin", t("common.city"), esc(cityName(order.city))) : "",
        order.address ? metaTile("house", t("common.address"), esc(order.address)) : "",
        order.price ? metaTile("wallet", order.master_id ? t("detail.price") : t("detail.budget"), formatPrice(order.price)) : "",
        metaTile("clock", t("detail.created"), formatDate(order.created_at, true)),
      ].join("");
      const chosen = isClient && order.master_id ? offers.find(o => o.master.id === order.master_id) : null;

      document.getElementById("content").innerHTML = `
        <a class="back-link" href="${backHref}">${icon("arrow-left", "sm")}${isClient ? t("nav.myRequests") : t("nav.myJobs")}</a>
        <div class="card-box">
          <div class="row" style="gap:14px">
            ${categoryBadge(categoryName, "cat-dot lg")}
            <div style="flex:1;min-width:150px">
              <h1 style="margin:0;font-size:22px;overflow-wrap:anywhere">${esc(catName(categoryName))}</h1>
              <div class="muted">${isClient ? t("detail.reqTitle", { id: order.id }) : t("common.orderNum", { id: order.id })}</div>
            </div>
            ${statusPillHtml(order.status)}
          </div>
          ${stepperHtml(order.status)}
          <p style="white-space:pre-wrap;margin:22px 0 0;font-size:16px">${esc(order.description)}</p>
          <div class="order-meta-grid">${tiles}</div>
          ${order.photos.length ? `<div class="photo-grid" style="margin:16px 0 0">${order.photos.map(p =>
            `<a href="${esc(uploadUrl(p.url))}" target="_blank" rel="noopener"><img class="photo-thumb" src="${esc(uploadUrl(p.url))}" alt="${t("detail.photoAlt")}" loading="lazy" /></a>`).join("")}</div>` : ""}
        </div>

        ${promiseHtml()}
        ${order.master_contact ? `<div style="margin-top:16px">${contactHtml(order.master_contact, t("detail.yourMaster"), `master.html?id=${order.master_id}`,
            chosen ? chosen.master.photo : null, order.status === "master_selected" ? t("detail.callMaster") : "")}</div>` : ""}
        ${order.client_contact ? `<div style="margin-top:16px">${contactHtml(order.client_contact, t("detail.client"), null)}</div>` : ""}

        ${offersHtml()}
        <div class="stack" style="margin-top:16px">${actionsHtml()}</div>
      `;
      if (document.getElementById("starInput")) setRating(reviewRating);
    }

    function notFound(title) {
      document.getElementById("content").innerHTML = emptyState(isClient ? "search-x" : "lock", esc(title), "",
        `<a class="btn" href="${backHref}">${t("detail.toOrders")}</a>`);
    }

    async function load() {
      try {
        const cats = await api.categories();
        if (isClient) {
          order = await api.getRequest(token);
          offers = order.offers;
          rememberRequest(token, order.id);  // opened from a saved link on a new device
        } else {
          if (!/^\d+$/.test(orderId || "")) return notFound(t("detail.notFound"));
          order = await api.getOrder(orderId);
          offers = await api.orderOffers(orderId);
        }
        categoryName = cats.find(c => c.id === order.category_id)?.name || t("common.order");
        render();
      } catch (e) {
        notFound(e.status === 404 && isClient ? t("myreq.gone") : e.message);
      }
    }

    async function run(action, successMessage) {
      try {
        await action();
        toast(successMessage);
        await load();
        if (!isClient) refreshUnread();
      } catch (e) {
        toast(t("common.error") + e.message);
      }
    }

    function accept(offerId, price) {
      if (!confirm(t("detail.confirmAccept", { price: formatPrice(price) }))) return;
      run(() => api.acceptRequestOffer(token, offerId), t("detail.chosenToast"));
    }

    function setStatus(status) {
      run(() => api.setOrderStatus(orderId, status), t("detail.statusUpdated"));
    }

    function complete() {
      run(() => api.completeRequest(token), t("detail.statusUpdated"));
    }

    function cancelRequest() {
      if (!confirm(t("detail.confirmCancel"))) return;
      run(() => api.cancelRequest(token), t("detail.cancelled"));
    }

    function setRating(n) {
      reviewRating = n;
      document.querySelectorAll("#starInput button").forEach(b => b.classList.toggle("on", Number(b.dataset.n) <= n));
    }

    async function sendReview() {
      try {
        await api.reviewRequest(token, { rating: reviewRating, text: document.getElementById("reviewText").value.trim() || null });
        toast(t("detail.thanks"));
        load();
      } catch (e) {
        document.getElementById("reviewError").textContent = e.message;
      }
    }

    function toggleComplaint() {
      const form = document.getElementById("complaintForm");
      form.hidden = !form.hidden;
    }

    async function sendComplaint() {
      try {
        await api.requestComplaint(token, document.getElementById("complaintText").value.trim());
        toast(t("detail.reportSent"));
        document.getElementById("complaintForm").hidden = true;
      } catch (e) {
        document.getElementById("complaintError").textContent = e.message;
      }
    }

    document.getElementById("content").addEventListener("click", (e) => {
      const button = e.target.closest("[data-copy]");
      if (button) copyText(button.dataset.copy);
    });

    if (loggedIn) load();
    if (isClient) {
      // Tick the countdown every second; fetch new offers every 15 s while the request is open
      // (not while the client is typing a complaint).
      setInterval(() => {
        const time = document.getElementById("promiseTime");
        if (!time || !order) return;
        const left = secondsLeft(order.response_deadline);
        if (left <= 0) return render();
        time.textContent = formatCountdown(left);
        document.getElementById("promiseClock").style.setProperty("--p", Math.min(1, left / 1200));
      }, 1000);
      setInterval(() => {
        const typing = document.getElementById("complaintForm") && !document.getElementById("complaintForm").hidden;
        if (order && OPEN.includes(order.status) && !document.hidden && !typing) load();
      }, 15000);
    }
    renderNav();
  </script>
</body>
</html>
