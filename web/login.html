<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="login.docTitle">Вход — Мастер рядом</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="logo" href="index.html"><span class="logo-mark"><svg class="i" aria-hidden="true"><use href="#i-wrench"></use></svg></span> Мастер рядом</a>
    <nav id="nav"></nav>
  </header>

  <main>
    <div class="auth-wrap reveal">
      <div class="auth-head">
        <div class="badge-icon"><svg class="i " aria-hidden="true"><use href="#i-user-round"></use></svg></div>
        <h1 data-i18n="login.title">С возвращением</h1>
        <p data-i18n="login.sub">Войдите, чтобы создавать заказы и видеть контакты мастеров</p>
      </div>

      <form class="card" id="loginForm">
        <label>
          <span data-i18n="common.phone">Телефон</span>
          <span class="input-icon"><svg class="i " aria-hidden="true"><use href="#i-phone"></use></svg><input id="phone" type="tel" autocomplete="tel" placeholder="+996 700 000 000" required maxlength="32" /></span>
        </label>
        <label>
          <span data-i18n="login.password">Пароль</span>
          <span class="input-icon"><svg class="i " aria-hidden="true"><use href="#i-lock"></use></svg><input id="password" type="password" autocomplete="current-password" required maxlength="72" /></span>
          <a class="link hint" href="reset.html" style="align-self:flex-end;font-weight:600" data-i18n="login.forgot">Забыли пароль?</a>
        </label>
        <div id="formError" class="error" role="alert"></div>
        <button class="btn block large" type="submit" id="submitBtn"><span data-i18n="nav.login">Войти</span><svg class="i " aria-hidden="true"><use href="#i-arrow-right"></use></svg></button>
        <p class="auth-foot"><span data-i18n="login.noAccount">Нет аккаунта?</span> <a class="link" id="registerLink" href="register.html" data-i18n="reg.submit">Зарегистрироваться</a></p>
      </form>
    </div>
  </main>

  <script src="js/icons.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script>
    const next = safeNext(new URLSearchParams(location.search).get("next"));
    if (next !== "index.html") document.getElementById("registerLink").href = `register.html?next=${encodeURIComponent(next)}`;

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById("formError");
      const button = document.getElementById("submitBtn");
      errorBox.textContent = "";
      button.disabled = true;
      try {
        const { access_token } = await api.login({
          phone: document.getElementById("phone").value,
          password: document.getElementById("password").value,
        });
        setToken(access_token);
        location.href = next;
      } catch (e) {
        errorBox.textContent = t("login.fail") + e.message;
        button.disabled = false;
      }
    });

    renderNav();
  </script>
</body>
</html>
