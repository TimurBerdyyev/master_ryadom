<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Новый заказ — Мастер рядом</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="logo" href="index.html"><span class="logo-mark">🔧</span> Мастер рядом</a>
    <nav id="nav"></nav>
  </header>

  <main class="narrow">
    <h1>Создать заказ</h1>
    <p class="muted" style="margin-top:-6px;margin-bottom:20px">Заявку увидят мастера этой категории — они предложат цену, а вы выберете лучшее предложение.</p>

    <form class="card" id="orderForm" style="max-width:none">
      <label>
        Категория
        <select id="category" required></select>
      </label>

      <label>
        Опишите задачу
        <textarea id="description" rows="4" required maxlength="2000" placeholder="Например: течёт кран на кухне, нужен новый смеситель"></textarea>
      </label>

      <label>
        Адрес
        <input id="address" type="text" maxlength="500" placeholder="Город, улица, дом" />
        <span class="hint">Мастер увидит адрес только после того, как вы его выберете</span>
      </label>

      <div class="form-grid">
        <label>
          Дата
          <input id="date" type="date" />
        </label>
        <label>
          Время
          <input id="time" type="time" />
        </label>
      </div>

      <label>
        Ваш бюджет, сом (необязательно)
        <input id="price" type="number" min="0" max="10000000" placeholder="Оставьте пустым — мастера предложат цену сами" />
      </label>

      <label>
        Фото (до 5 штук, необязательно)
        <input id="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple />
      </label>

      <div id="formError" class="error"></div>
      <button class="btn" type="submit" id="submitBtn">Отправить заявку</button>
    </form>
  </main>

  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script>
    const loggedIn = requireLogin("order.html" + location.search);

    const preselectCategory = new URLSearchParams(location.search).get("category_id");
    document.getElementById("date").min = new Date().toISOString().slice(0, 10);

    async function loadCategories() {
      const select = document.getElementById("category");
      try {
        const categories = await api.categories();
        select.innerHTML = categories.map(c => `<option value="${c.id}">${categoryIcon(c.name)} ${esc(c.name)}</option>`).join("");
        if (preselectCategory) select.value = preselectCategory;
      } catch (e) {
        document.getElementById("formError").textContent = "Не удалось загрузить категории: " + e.message;
      }
    }

    document.getElementById("photos").addEventListener("change", (e) => {
      if (e.target.files.length > 5) {
        document.getElementById("formError").textContent = "Можно приложить не больше 5 фото";
        e.target.value = "";
      }
    });

    document.getElementById("orderForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById("formError");
      const button = document.getElementById("submitBtn");
      errorBox.textContent = "";

      const date = document.getElementById("date").value;
      const time = document.getElementById("time").value;
      const price = document.getElementById("price").value;
      const photoFiles = Array.from(document.getElementById("photos").files || []);

      const payload = {
        category_id: Number(document.getElementById("category").value),
        description: document.getElementById("description").value.trim(),
        address: document.getElementById("address").value.trim() || null,
        date: date ? new Date(`${date}T${time || "00:00"}:00`).toISOString() : null,
        time: time || null,
        price: price ? Number(price) : null,
      };

      button.disabled = true;
      button.textContent = "Отправляем…";
      try {
        const order = await api.createOrder(payload);
        let photoWarning = "";
        if (photoFiles.length) {
          try {
            await api.uploadOrderPhotos(order.id, photoFiles);
          } catch (photoErr) {
            photoWarning = "&photo_error=1";
          }
        }
        location.href = `order-success.html?id=${order.id}${photoWarning}`;
      } catch (e) {
        errorBox.textContent = "Не удалось отправить заявку: " + e.message;
        button.disabled = false;
        button.textContent = "Отправить заявку";
      }
    });

    if (loggedIn) loadCategories();
    renderNav();
  </script>
</body>
</html>
