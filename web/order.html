<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="neworder.docTitle">Новый заказ — Мастер рядом</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .cat-picker {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 8px;
    }

    .cat-picker input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .cat-picker label {
      flex-direction: row !important;
      align-items: center;
      gap: 10px !important;
      padding: 10px 12px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-weight: 500 !important;
      font-size: 14px !important;
      line-height: 1.25;
      cursor: pointer;
      transition: border-color .2s, background .2s, box-shadow .2s;
    }

    .cat-picker label:hover {
      border-color: var(--border-strong);
    }

    .cat-picker input:checked + label {
      border-color: var(--primary);
      background: var(--primary-50);
      box-shadow: 0 0 0 1px var(--primary);
    }

    .cat-picker input:focus-visible + label {
      box-shadow: var(--ring);
    }

    .cat-picker .cat-dot {
      width: 32px;
      height: 32px;
      border-radius: 10px;
    }

    .cat-picker .cat-dot .i {
      width: 17px;
      height: 17px;
    }

    .fieldset-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: -8px;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="logo" href="index.html"><span class="logo-mark"><svg class="i" aria-hidden="true"><use href="#i-wrench"></use></svg></span> Мастер рядом</a>
    <nav id="nav"></nav>
  </header>

  <main class="narrow">
    <div class="page-head">
      <div>
        <h1 data-i18n="neworder.title">Новый заказ</h1>
        <p class="muted" data-i18n="neworder.sub">Заявку увидят мастера выбранной категории — они предложат цену, а вы выберете лучшее предложение.</p>
      </div>
    </div>

    <form class="card reveal" id="orderForm" style="max-width:none">
      <h2 class="form-section-title"><svg class="i" aria-hidden="true"><use href="#i-layout-grid"></use></svg><span data-i18n="neworder.what">Что нужно сделать</span></h2>
      <div class="fieldset-title" id="catLabel" data-i18n="neworder.category">Категория</div>
      <div class="cat-picker" id="categoryPicker" role="radiogroup" aria-labelledby="catLabel"></div>

      <label>
        <span data-i18n="neworder.describe">Опишите задачу</span>
        <textarea id="description" rows="4" required maxlength="2000" data-i18n-ph="neworder.describePh"></textarea>
        <span class="hint" data-i18n="neworder.describeHint">Чем подробнее — тем точнее мастера назовут цену</span>
      </label>

      <h2 class="form-section-title" style="margin-top:8px"><svg class="i" aria-hidden="true"><use href="#i-map-pin"></use></svg><span data-i18n="neworder.where">Где и когда</span></h2>
      <label>
        <span data-i18n="common.city">Город</span>
        <select id="city" required></select>
        <span class="hint" data-i18n="neworder.cityHint">Заказ увидят мастера из этого города</span>
      </label>

      <label>
        <span data-i18n="common.address">Адрес</span>
        <span class="input-icon"><svg class="i" aria-hidden="true"><use href="#i-house"></use></svg><input id="address" type="text" maxlength="500" data-i18n-ph="neworder.addressPh" /></span>
        <span class="hint" data-i18n="neworder.addressHint">Мастер увидит адрес только после того, как вы его выберете</span>
      </label>

      <div class="form-grid">
        <label>
          <span data-i18n="neworder.date">Дата</span>
          <input id="date" type="date" />
        </label>
        <label>
          <span data-i18n="neworder.time">Время</span>
          <input id="time" type="time" />
        </label>
      </div>

      <h2 class="form-section-title" style="margin-top:8px"><svg class="i" aria-hidden="true"><use href="#i-wallet"></use></svg><span data-i18n="neworder.budgetTitle">Бюджет и фото</span></h2>
      <label>
        <span data-i18n="neworder.budget">Ваш бюджет, сом</span>
        <input id="price" type="number" min="0" max="10000000" data-i18n-ph="neworder.budgetPh" />
      </label>

      <label>
        <span data-i18n="neworder.photos">Фото (до 5 штук)</span>
        <input id="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple />
        <span class="hint" data-i18n="neworder.photosHint">JPEG, PNG или WebP — помогают мастеру оценить работу</span>
      </label>

      <div id="formError" class="error" role="alert"></div>
      <button class="btn accent large" type="submit" id="submitBtn"><svg class="i" aria-hidden="true"><use href="#i-send"></use></svg><span data-i18n="neworder.submit">Отправить заявку</span></button>
    </form>
  </main>

  <script src="js/icons.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script>
    const loggedIn = requireLogin("order.html" + location.search);

    const preselectCategory = new URLSearchParams(location.search).get("category_id");
    document.getElementById("date").min = new Date().toISOString().slice(0, 10);

    function lastCity() {
      try {
        return localStorage.getItem("lastCity") || "";
      } catch (e) {
        return "";
      }
    }

    async function loadCities() {
      document.getElementById("city").innerHTML = await cityOptionsHtml(lastCity());
    }

    async function loadCategories() {
      const picker = document.getElementById("categoryPicker");
      try {
        const categories = await api.categories();
        picker.innerHTML = categories.map((c, i) => `
          <input type="radio" name="category" id="cat${c.id}" value="${c.id}" ${String(c.id) === preselectCategory || (!preselectCategory && i === 0) ? "checked" : ""} required />
          <label for="cat${c.id}">${categoryBadge(c.name)}<span>${esc(catName(c.name))}</span></label>
        `).join("");
      } catch (e) {
        document.getElementById("formError").textContent = t("neworder.catError") + e.message;
      }
    }

    document.getElementById("photos").addEventListener("change", (e) => {
      if (e.target.files.length > 5) {
        document.getElementById("formError").textContent = t("neworder.maxPhotos");
        e.target.value = "";
      }
    });

    document.getElementById("orderForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById("formError");
      const button = document.getElementById("submitBtn");
      errorBox.textContent = "";

      const checked = document.querySelector('input[name="category"]:checked');
      if (!checked) {
        errorBox.textContent = t("neworder.chooseCat");
        return;
      }

      const date = document.getElementById("date").value;
      const time = document.getElementById("time").value;
      const price = document.getElementById("price").value;
      const photoFiles = Array.from(document.getElementById("photos").files || []);

      const payload = {
        category_id: Number(checked.value),
        city: document.getElementById("city").value,
        description: document.getElementById("description").value.trim(),
        address: document.getElementById("address").value.trim() || null,
        date: date ? new Date(`${date}T${time || "00:00"}:00`).toISOString() : null,
        time: time || null,
        price: price ? Number(price) : null,
      };

      button.disabled = true;
      try {
        const order = await api.createOrder(payload);
        try {
          localStorage.setItem("lastCity", payload.city);
        } catch (e) {
          /* storage unavailable */
        }
        let photoWarning = "";
        if (photoFiles.length) {
          try {
            await api.uploadOrderPhotos(order.id, photoFiles);
          } catch (photoErr) {
            photoWarning = "&photo_error=1";
          }
        }
        location.href = `order-success.html?id=${order.id}${photoWarning}`;
      } catch (e) {
        errorBox.textContent = t("neworder.sendError") + e.message;
        button.disabled = false;
      }
    });

    if (loggedIn) {
      loadCategories();
      loadCities().catch(() => {});
    }
    renderNav();
  </script>
</body>
</html>
