<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Уведомления — Мастер рядом</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="logo" href="index.html"><span class="logo-mark">🔧</span> Мастер рядом</a>
    <nav id="nav"></nav>
  </header>

  <main class="narrow">
    <h1>Уведомления</h1>
    <div id="list"></div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script>
    const loggedIn = requireLogin("notifications.html");

    // Pull "#123" out of a notification so it can link straight to the order.
    function orderLink(text) {
      const match = /#(\d+)/.exec(text || "");
      return match ? `order-detail.html?id=${match[1]}` : null;
    }

    async function load() {
      const list = document.getElementById("list");
      list.innerHTML = skeletons(4, 64);
      try {
        const items = await api.notifications();
        if (!items.length) {
          list.innerHTML = `<div class="empty"><div class="emoji">🔔</div><h3>Уведомлений пока нет</h3><p>Здесь появятся новые предложения и изменения статуса заказов.</p></div>`;
          return;
        }
        list.innerHTML = `<div class="card-box" style="padding:0;overflow:hidden">${items.map(n => {
          const href = orderLink(n.text);
          const body = `
            <span class="dot"></span>
            <div style="flex:1">
              <div style="font-weight:700">${esc(n.title)}</div>
              ${n.text ? `<div class="muted">${esc(n.text)}</div>` : ""}
              <div class="muted" style="font-size:12px;margin-top:2px">${formatDate(n.created_at, true)}</div>
            </div>`;
          return href
            ? `<a class="notification ${n.is_read ? "" : "unread"}" href="${href}">${body}</a>`
            : `<div class="notification ${n.is_read ? "" : "unread"}">${body}</div>`;
        }).join("")}</div>`;
        if (items.some(n => !n.is_read)) {
          await api.readAllNotifications();
          refreshUnread();
        }
      } catch (e) {
        list.innerHTML = `<p class="error">Ошибка: ${esc(e.message)}</p>`;
      }
    }

    if (loggedIn) load();
    renderNav();
  </script>
</body>
</html>
