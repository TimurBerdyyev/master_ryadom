<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title data-i18n="admin.tabCategories">Категории — Админ-панель</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="apple-touch-icon" href="../apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Мастер рядом" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="logo" href="../index.html"><span class="logo-mark"><svg class="i" aria-hidden="true"><use href="#i-wrench"></use></svg></span> Мастер рядом</a>
    <nav id="nav"></nav>
  </header>

  <main class="wide">
    <h1 data-i18n="admin.tabCategories">Категории</h1>
    <div class="admin-tabs">
      <a href="index.html"><svg class="i" aria-hidden="true"><use href="#i-layout-grid"></use></svg><span data-i18n="admin.tabDashboard">Дашборд</span></a>
      <a href="users.html"><svg class="i" aria-hidden="true"><use href="#i-users"></use></svg><span data-i18n="admin.tabUsers">Пользователи</span></a>
      <a href="masters.html"><svg class="i" aria-hidden="true"><use href="#i-briefcase"></use></svg><span data-i18n="admin.tabMasters">Мастера</span></a>
      <a href="orders.html"><svg class="i" aria-hidden="true"><use href="#i-clipboard-list"></use></svg><span data-i18n="admin.tabOrders">Заказы</span></a>
      <a href="requests.html"><svg class="i" aria-hidden="true"><use href="#i-timer"></use></svg><span data-i18n="admin.tabUnanswered">Без ответа</span></a>
      <a href="complaints.html"><svg class="i" aria-hidden="true"><use href="#i-flag"></use></svg><span data-i18n="admin.tabComplaints">Жалобы</span></a>
      <a href="subscriptions.html"><svg class="i" aria-hidden="true"><use href="#i-wallet"></use></svg><span data-i18n="admin.tabSubs">Подписки</span></a>
      <a href="categories.html" class="active"><svg class="i" aria-hidden="true"><use href="#i-list-filter"></use></svg><span data-i18n="admin.tabCategories">Категории</span></a>
    </div>

    <div id="content"><p class="muted" data-i18n="common.loading">Загрузка…</p></div>

    <form class="card" id="addForm" style="margin-top:20px">
      <label>
        <span data-i18n="admin.newCatLabel">Название категории</span>
        <input id="categoryName" type="text" required data-i18n-ph="admin.newCatPh" />
      </label>
      <div id="formError" class="error"></div>
      <button class="btn secondary" type="submit" data-i18n="admin.addCat">Добавить категорию</button>
    </form>
  </main>

  <script src="../js/icons.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/nav.js"></script>
  <script src="guard.js"></script>
  <script>
    async function load() {
      const content = document.getElementById("content");
      try {
        const categories = await api.adminCategories();
        content.innerHTML = `
          <div class="table-wrap"><table class="admin-table">
            <thead><tr><th>${t("admin.catName")}</th><th></th></tr></thead>
            <tbody>
              ${categories.map(c => `
                <tr>
                  <td><span class="row" style="gap:10px;flex-wrap:nowrap">${categoryBadge(c.name)}${esc(catName(c.name))}</span></td>
                  <td><button class="btn small danger-soft" onclick="removeCategory(${c.id})">${t("common.delete")}</button></td>
                </tr>
              `).join("")}
            </tbody>
          </table></div>
        `;
      } catch (e) {
        content.innerHTML = `<p class="error">${esc(t("common.error") + e.message)}</p>`;
      }
    }

    async function removeCategory(id) {
      if (!confirm(t("admin.catConfirm"))) return;
      try {
        await api.adminDeleteCategory(id);
        load();
      } catch (e) {
        toast(t("admin.deleteError") + e.message);
      }
    }

    document.getElementById("addForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById("formError");
      errorBox.textContent = "";
      try {
        await api.adminAddCategory({ name: document.getElementById("categoryName").value });
        document.getElementById("categoryName").value = "";
        load();
      } catch (e) {
        errorBox.textContent = t("admin.addError") + e.message;
      }
    });

    requireAdmin().then(load);
    renderNav();
  </script>
</body>
</html>
