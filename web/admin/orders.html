<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Заказы — Админ-панель</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="logo" href="../index.html"><span class="logo-mark"><svg class="i" aria-hidden="true"><use href="#i-wrench"></use></svg></span> Мастер рядом</a>
    <nav id="nav"></nav>
  </header>

  <main class="wide">
    <h1>Заказы</h1>
    <div class="admin-tabs">
      <a href="index.html"><svg class="i" aria-hidden="true"><use href="#i-layout-grid"></use></svg>Дашборд</a>
      <a href="users.html"><svg class="i" aria-hidden="true"><use href="#i-users"></use></svg>Пользователи</a>
      <a href="masters.html"><svg class="i" aria-hidden="true"><use href="#i-briefcase"></use></svg>Мастера</a>
      <a href="orders.html" class="active"><svg class="i" aria-hidden="true"><use href="#i-clipboard-list"></use></svg>Заказы</a>
      <a href="complaints.html"><svg class="i" aria-hidden="true"><use href="#i-flag"></use></svg>Жалобы</a>
      <a href="categories.html"><svg class="i" aria-hidden="true"><use href="#i-list-filter"></use></svg>Категории</a>
    </div>

    <div class="filters">
      <select id="statusFilter">
        <option value="">Все статусы</option>
        <option value="created">Создан</option>
        <option value="searching">Ищем мастера</option>
        <option value="offers_received">Получены предложения</option>
        <option value="master_selected">Мастер выбран</option>
        <option value="in_progress">Работа начата</option>
        <option value="completed">Завершён</option>
        <option value="reviewed">С отзывом</option>
        <option value="cancelled">Отменён</option>
      </select>
      <button class="btn secondary" onclick="load()">Применить</button>
    </div>

    <div id="content"><p class="muted">Загрузка…</p></div>
  </main>

  <script src="../js/icons.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/nav.js"></script>
  <script src="guard.js"></script>
  <script>
    const statusLabels = {
      created: "Создан",
      searching: "Ищем мастера",
      offers_received: "Получены предложения",
      master_selected: "Мастер выбран",
      master_confirmed: "Мастер подтвердил",
      master_en_route: "Мастер в пути",
      in_progress: "Работа начата",
      completed: "Завершён",
      reviewed: "С отзывом",
      cancelled: "Отменён",
    };

    async function load() {
      const content = document.getElementById("content");
      content.innerHTML = `<p class="muted">Загрузка…</p>`;
      const statusValue = document.getElementById("statusFilter").value;
      try {
        const orders = await api.adminOrders(statusValue ? { status: statusValue } : {});
        if (!orders.length) {
          content.innerHTML = `<p class="muted">Заказов не найдено</p>`;
          return;
        }
        content.innerHTML = `
          <div class="table-wrap"><table class="admin-table">
            <thead>
              <tr><th>#</th><th>Описание</th><th>Адрес</th><th>Цена</th><th>Фото</th><th>Статус</th><th>Создан</th></tr>
            </thead>
            <tbody>
              ${orders.map(o => `
                <tr>
                  <td>${o.id}</td>
                  <td>${esc(o.description.slice(0, 60))}</td>
                  <td>${o.address ? esc(o.address) : "—"}</td>
                  <td>${o.price ? o.price + " сом" : "—"}</td>
                  <td>${o.photos.length ? o.photos.map(p => `<a href="${esc(uploadUrl(p.url))}" target="_blank"><img class="photo-thumb" style="width:32px;height:32px;display:inline-block" src="${esc(uploadUrl(p.url))}" /></a>`).join(" ") : "—"}</td>
                  <td>${statusLabels[o.status] || o.status}</td>
                  <td>${new Date(o.created_at).toLocaleDateString("ru-RU")}</td>
                </tr>
              `).join("")}
            </tbody>
          </table></div>
        `;
      } catch (e) {
        content.innerHTML = `<p class="error">Ошибка: ${esc(e.message)}</p>`;
      }
    }

    requireAdmin().then(load);
    renderNav();
  </script>
</body>
</html>
