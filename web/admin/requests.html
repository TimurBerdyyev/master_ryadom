<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Без ответа — Админ-панель</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="logo" href="../index.html"><span class="logo-mark"><svg class="i" aria-hidden="true"><use href="#i-wrench"></use></svg></span> Мастер рядом</a>
    <nav id="nav"></nav>
  </header>

  <main class="wide">
    <h1 data-i18n="admin.tabUnanswered">Без ответа</h1>
    <div class="admin-tabs">
      <a href="index.html"><svg class="i" aria-hidden="true"><use href="#i-layout-grid"></use></svg><span data-i18n="admin.tabDashboard">Дашборд</span></a>
      <a href="users.html"><svg class="i" aria-hidden="true"><use href="#i-users"></use></svg><span data-i18n="admin.tabUsers">Пользователи</span></a>
      <a href="masters.html"><svg class="i" aria-hidden="true"><use href="#i-briefcase"></use></svg><span data-i18n="admin.tabMasters">Мастера</span></a>
      <a href="orders.html"><svg class="i" aria-hidden="true"><use href="#i-clipboard-list"></use></svg><span data-i18n="admin.tabOrders">Заказы</span></a>
      <a href="requests.html" class="active"><svg class="i" aria-hidden="true"><use href="#i-timer"></use></svg><span data-i18n="admin.tabUnanswered">Без ответа</span></a>
      <a href="complaints.html"><svg class="i" aria-hidden="true"><use href="#i-flag"></use></svg><span data-i18n="admin.tabComplaints">Жалобы</span></a>
      <a href="subscriptions.html"><svg class="i" aria-hidden="true"><use href="#i-wallet"></use></svg><span data-i18n="admin.tabSubs">Подписки</span></a>
      <a href="categories.html"><svg class="i" aria-hidden="true"><use href="#i-list-filter"></use></svg><span data-i18n="admin.tabCategories">Категории</span></a>
    </div>

    <div class="section-title" style="margin-top:8px"><span data-i18n="admin.tabUnanswered">Без ответа</span></div>
    <p class="muted" data-i18n="admin.unansweredSub">Мастера не ответили за 20 минут — позвоните клиенту и подберите мастера.</p>
    <div id="unanswered"><p class="muted" data-i18n="common.loading">Загрузка…</p></div>

    <div class="section-title"><span data-i18n="admin.tabViolations">Нарушения</span></div>
    <p class="muted" data-i18n="admin.violationsSub">Пропущенные 20-минутные ответы и штрафы по договору.</p>
    <div id="violations"><p class="muted" data-i18n="common.loading">Загрузка…</p></div>
  </main>

  <script src="../js/icons.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/nav.js"></script>
  <script src="guard.js"></script>
  <script>
    let categories = {};

    async function loadUnanswered() {
      const box = document.getElementById("unanswered");
      try {
        const list = await api.adminUnanswered();
        if (!list.length) {
          box.innerHTML = `<p class="notice success">${icon("circle-check")}<span>${t("admin.noUnanswered")}</span></p>`;
          return;
        }
        box.innerHTML = `
          <div class="table-wrap"><table class="admin-table">
            <thead><tr><th>#</th><th>${t("admin.client")}</th><th>${t("neworder.category")}</th><th>${t("common.city")}</th><th>${t("admin.description")}</th><th>${t("detail.created")}</th><th></th></tr></thead>
            <tbody>
              ${list.map(o => `
                <tr>
                  <td>${o.id}</td>
                  <td>${esc(o.client_name || "—")}<br>${o.client_phone ? `<a class="btn small" href="${esc(telLink(o.client_phone))}">${icon("phone")}${esc(o.client_phone)}</a>` : ""}</td>
                  <td>${esc(catName(categories[o.category_id] || ""))}</td>
                  <td>${o.city ? esc(cityName(o.city)) : "—"}</td>
                  <td>${esc(o.description.slice(0, 120))}</td>
                  <td>${formatDate(o.created_at, true)}</td>
                  <td class="muted">${t("admin.notified", { n: o.masters_notified })}</td>
                </tr>`).join("")}
            </tbody>
          </table></div>`;
      } catch (e) {
        box.innerHTML = `<p class="error">${esc(t("common.error") + e.message)}</p>`;
      }
    }

    async function loadViolations() {
      const box = document.getElementById("violations");
      try {
        const list = await api.adminViolations();
        if (!list.length) {
          box.innerHTML = `<p class="muted">${t("admin.noViolations")}</p>`;
          return;
        }
        box.innerHTML = `
          <div class="table-wrap"><table class="admin-table">
            <thead><tr><th>${t("admin.master")}</th><th>${t("common.phone")}</th><th>${t("common.order")}</th><th>${t("admin.deadline")}</th><th>${t("admin.fine")}</th></tr></thead>
            <tbody>
              ${list.map(v => `
                <tr>
                  <td><a class="link" href="../master.html?id=${v.master_id}">${esc(v.master_name)}</a></td>
                  <td><a class="link" href="${esc(telLink(v.master_phone))}">${esc(v.master_phone)}</a></td>
                  <td>#${v.order_id}</td>
                  <td>${formatDate(v.deadline_at, true)}</td>
                  <td><b>${formatPrice(v.fine)}</b></td>
                </tr>`).join("")}
            </tbody>
          </table></div>`;
      } catch (e) {
        box.innerHTML = `<p class="error">${esc(t("common.error") + e.message)}</p>`;
      }
    }

    requireAdmin().then(async () => {
      try {
        categories = Object.fromEntries((await api.categories()).map(c => [c.id, c.name]));
      } catch (e) {
        /* category column stays empty */
      }
      loadUnanswered();
      loadViolations();
      setInterval(loadUnanswered, 60000);
    });
    renderNav();
  </script>
</body>
</html>
