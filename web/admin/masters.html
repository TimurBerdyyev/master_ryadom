<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="admin.tabMasters">Мастера — Админ-панель</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="logo" href="../index.html"><span class="logo-mark"><svg class="i" aria-hidden="true"><use href="#i-wrench"></use></svg></span> Мастер рядом</a>
    <nav id="nav"></nav>
  </header>

  <main class="wide">
    <h1 data-i18n="admin.tabMasters">Мастера</h1>
    <div class="admin-tabs">
      <a href="index.html"><svg class="i" aria-hidden="true"><use href="#i-layout-grid"></use></svg><span data-i18n="admin.tabDashboard">Дашборд</span></a>
      <a href="users.html"><svg class="i" aria-hidden="true"><use href="#i-users"></use></svg><span data-i18n="admin.tabUsers">Пользователи</span></a>
      <a href="masters.html" class="active"><svg class="i" aria-hidden="true"><use href="#i-briefcase"></use></svg><span data-i18n="admin.tabMasters">Мастера</span></a>
      <a href="orders.html"><svg class="i" aria-hidden="true"><use href="#i-clipboard-list"></use></svg><span data-i18n="admin.tabOrders">Заказы</span></a>
      <a href="complaints.html"><svg class="i" aria-hidden="true"><use href="#i-flag"></use></svg><span data-i18n="admin.tabComplaints">Жалобы</span></a>
      <a href="subscriptions.html"><svg class="i" aria-hidden="true"><use href="#i-wallet"></use></svg><span data-i18n="admin.tabSubs">Подписки</span></a>
      <a href="categories.html"><svg class="i" aria-hidden="true"><use href="#i-list-filter"></use></svg><span data-i18n="admin.tabCategories">Категории</span></a>
    </div>

    <div id="content"><p class="muted" data-i18n="common.loading">Загрузка…</p></div>
  </main>

  <script src="../js/icons.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/nav.js"></script>
  <script src="guard.js"></script>
  <script>
    async function load() {
      const content = document.getElementById("content");
      try {
        const masters = await api.adminMasters();
        content.innerHTML = `
          <div class="table-wrap"><table class="admin-table">
            <thead>
              <tr><th>${t("admin.master")}</th><th>${t("common.phone")}</th><th>${t("common.city")}</th><th>${t("admin.rating")}</th><th>${t("admin.orders")}</th><th>${t("admin.status")}</th><th></th></tr>
            </thead>
            <tbody>
              ${masters.map(m => `
                <tr>
                  <td><a href="../master.html?id=${m.id}">${esc(m.user.name)}</a></td>
                  <td>${esc(m.user.phone)}</td>
                  <td>${m.city ? esc(m.city) : "—"}</td>
                  <td>${ratingHtml(m.rating)}</td>
                  <td>${m.completed_orders}</td>
                  <td>${m.verified
                    ? `<span class="status-pill ok">${t("common.verified")}</span>`
                    : `<span class="status-pill warn">${t("admin.notVerified")}</span>`}</td>
                  <td>
                    ${m.verified
                      ? `<button class="btn small secondary" onclick="setVerified(${m.id}, false)">${t("admin.unverify")}</button>`
                      : `<button class="btn small" onclick="setVerified(${m.id}, true)">${t("admin.verify")}</button>`}
                  </td>
                </tr>
              `).join("")}
            </tbody>
          </table></div>
        `;
      } catch (e) {
        content.innerHTML = `<p class="error">${esc(t("common.error") + e.message)}</p>`;
      }
    }

    async function setVerified(id, verified) {
      try {
        await api.adminVerifyMaster(id, verified);
        load();
      } catch (e) {
        toast(t("admin.statusError") + e.message);
      }
    }

    requireAdmin().then(load);
    renderNav();
  </script>
</body>
</html>
