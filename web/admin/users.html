<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title data-i18n="admin.tabUsers">Пользователи — Админ-панель</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="apple-touch-icon" href="../apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Мастер рядом" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="logo" href="../index.html"><span class="logo-mark"><svg class="i" aria-hidden="true"><use href="#i-wrench"></use></svg></span> Мастер рядом</a>
    <nav id="nav"></nav>
  </header>

  <main class="wide">
    <h1 data-i18n="admin.tabUsers">Пользователи</h1>
    <div class="admin-tabs">
      <a href="index.html"><svg class="i" aria-hidden="true"><use href="#i-layout-grid"></use></svg><span data-i18n="admin.tabDashboard">Дашборд</span></a>
      <a href="users.html" class="active"><svg class="i" aria-hidden="true"><use href="#i-users"></use></svg><span data-i18n="admin.tabUsers">Пользователи</span></a>
      <a href="masters.html"><svg class="i" aria-hidden="true"><use href="#i-briefcase"></use></svg><span data-i18n="admin.tabMasters">Мастера</span></a>
      <a href="orders.html"><svg class="i" aria-hidden="true"><use href="#i-clipboard-list"></use></svg><span data-i18n="admin.tabOrders">Заказы</span></a>
      <a href="requests.html"><svg class="i" aria-hidden="true"><use href="#i-timer"></use></svg><span data-i18n="admin.tabUnanswered">Без ответа</span></a>
      <a href="complaints.html"><svg class="i" aria-hidden="true"><use href="#i-flag"></use></svg><span data-i18n="admin.tabComplaints">Жалобы</span></a>
      <a href="subscriptions.html"><svg class="i" aria-hidden="true"><use href="#i-wallet"></use></svg><span data-i18n="admin.tabSubs">Подписки</span></a>
      <a href="categories.html"><svg class="i" aria-hidden="true"><use href="#i-list-filter"></use></svg><span data-i18n="admin.tabCategories">Категории</span></a>
    </div>

    <div id="content"><p class="muted" data-i18n="common.loading">Загрузка…</p></div>
  </main>

  <script src="../js/icons.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/nav.js"></script>
  <script src="guard.js"></script>
  <script>
    function statusPill(status) {
      return status === "blocked"
        ? `<span class="status-pill bad">${t("admin.blocked")}</span>`
        : `<span class="status-pill ok">${t("admin.active")}</span>`;
    }

    const roleLabels = { client: t("admin.roleClient"), master: t("admin.roleMaster"), admin: t("admin.roleAdmin") };

    async function load() {
      const content = document.getElementById("content");
      try {
        const users = await api.adminUsers();
        content.innerHTML = `
          <div class="table-wrap"><table class="admin-table">
            <thead>
              <tr><th>${t("admin.name")}</th><th>${t("common.phone")}</th><th>Email</th><th>${t("admin.role")}</th><th>${t("admin.status")}</th><th>${t("admin.registered")}</th><th></th></tr>
            </thead>
            <tbody>
              ${users.map(u => `
                <tr>
                  <td>${esc(u.name)}</td>
                  <td>${esc(u.phone)}</td>
                  <td>${u.email ? esc(u.email) : "—"}</td>
                  <td>${roleLabels[u.role] || u.role}</td>
                  <td>${statusPill(u.status)}</td>
                  <td>${formatDate(u.created_at)}</td>
                  <td>
                    ${u.role === "admin" ? "" : u.status === "blocked"
                      ? `<button class="btn small secondary" onclick="setStatus(${u.id}, 'active')">${t("admin.unblock")}</button>`
                      : `<button class="btn small danger-soft" onclick="setStatus(${u.id}, 'blocked')">${t("admin.block")}</button>`}
                  </td>
                </tr>
              `).join("")}
            </tbody>
          </table></div>
        `;
      } catch (e) {
        content.innerHTML = `<p class="error">${esc(t("common.error") + e.message)}</p>`;
      }
    }

    async function setStatus(id, status) {
      try {
        await api.adminSetUserStatus(id, status);
        load();
      } catch (e) {
        toast(t("admin.statusError") + e.message);
      }
    }

    requireAdmin().then(load);
    renderNav();
  </script>
</body>
</html>
