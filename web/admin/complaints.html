<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Жалобы — Админ-панель</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="logo" href="../index.html">🔧 Мастер рядом</a>
    <nav id="nav"></nav>
  </header>

  <main class="wide">
    <h1>Жалобы</h1>
    <div class="admin-tabs">
      <a href="index.html">Дашборд</a>
      <a href="users.html">Пользователи</a>
      <a href="masters.html">Мастера</a>
      <a href="orders.html">Заказы</a>
      <a href="complaints.html" class="active">Жалобы</a>
      <a href="categories.html">Категории</a>
    </div>

    <div id="content"><p class="muted">Загрузка…</p></div>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/nav.js"></script>
  <script src="guard.js"></script>
  <script>
    const statusLabels = { open: "Открыта", resolved: "Решена", dismissed: "Отклонена" };
    const statusClass = { open: "warn", resolved: "ok", dismissed: "bad" };

    async function load() {
      const content = document.getElementById("content");
      try {
        const complaints = await api.adminComplaints();
        if (!complaints.length) {
          content.innerHTML = `<p class="muted">Жалоб пока нет</p>`;
          return;
        }
        content.innerHTML = complaints.map(c => `
          <div class="review">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px">
              <span class="status-pill ${statusClass[c.status]}">${statusLabels[c.status]}</span>
              <span class="muted">${new Date(c.created_at).toLocaleDateString("ru-RU")}</span>
            </div>
            <div>${esc(c.text)}</div>
            <div class="muted" style="margin-top:6px">
              Автор #${c.author_id}${c.target_user_id ? `, на пользователя #${c.target_user_id}` : ""}${c.order_id ? `, заказ #${c.order_id}` : ""}
            </div>
            ${c.status === "open" ? `
              <div class="contact-actions">
                <button class="btn small" onclick="setStatus(${c.id}, 'resolved')">Решить</button>
                <button class="btn small secondary" onclick="setStatus(${c.id}, 'dismissed')">Отклонить</button>
              </div>
            ` : ""}
          </div>
        `).join("");
      } catch (e) {
        content.innerHTML = `<p class="error">Ошибка: ${esc(e.message)}</p>`;
      }
    }

    async function setStatus(id, status) {
      try {
        await api.adminSetComplaintStatus(id, status);
        load();
      } catch (e) {
        alert("Не удалось изменить статус: " + e.message);
      }
    }

    requireAdmin().then(load);
    renderNav();
  </script>
</body>
</html>
