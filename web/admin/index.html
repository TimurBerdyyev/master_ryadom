<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="admin.title">Админ-панель — Мастер рядом</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="logo" href="../index.html"><span class="logo-mark"><svg class="i" aria-hidden="true"><use href="#i-wrench"></use></svg></span> Мастер рядом</a>
    <nav id="nav"></nav>
  </header>

  <main class="wide">
    <h1 data-i18n="admin.title">Админ-панель</h1>
    <div class="admin-tabs">
      <a href="index.html" class="active"><svg class="i" aria-hidden="true"><use href="#i-layout-grid"></use></svg><span data-i18n="admin.tabDashboard">Дашборд</span></a>
      <a href="users.html"><svg class="i" aria-hidden="true"><use href="#i-users"></use></svg><span data-i18n="admin.tabUsers">Пользователи</span></a>
      <a href="masters.html"><svg class="i" aria-hidden="true"><use href="#i-briefcase"></use></svg><span data-i18n="admin.tabMasters">Мастера</span></a>
      <a href="orders.html"><svg class="i" aria-hidden="true"><use href="#i-clipboard-list"></use></svg><span data-i18n="admin.tabOrders">Заказы</span></a>
      <a href="complaints.html"><svg class="i" aria-hidden="true"><use href="#i-flag"></use></svg><span data-i18n="admin.tabComplaints">Жалобы</span></a>
      <a href="subscriptions.html"><svg class="i" aria-hidden="true"><use href="#i-wallet"></use></svg><span data-i18n="admin.tabSubs">Подписки</span></a>
      <a href="categories.html"><svg class="i" aria-hidden="true"><use href="#i-list-filter"></use></svg><span data-i18n="admin.tabCategories">Категории</span></a>
    </div>

    <div id="stats" class="stat-grid"></div>
  </main>

  <script src="../js/icons.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/nav.js"></script>
  <script src="guard.js"></script>
  <script>
    async function loadStats() {
      const grid = document.getElementById("stats");
      try {
        const s = await api.adminStats();
        const tiles = [
          [t("admin.statUsers"), s.users_total, "users"],
          [t("admin.statClients"), s.clients_total, "user"],
          [t("admin.statMasters", { n: s.masters_verified }), s.masters_total, "briefcase"],
          [t("admin.statActive"), s.orders_active, "timer"],
          [t("admin.statCompleted"), s.orders_completed, "circle-check"],
          [t("admin.statCancelled"), s.orders_cancelled, "circle-x"],
          [t("admin.statRevenue"), formatPrice(s.revenue_total), "wallet"],
          [t("admin.statCommission"), formatPrice(s.commission_total), "hand-coins"],
          [t("admin.statComplaints"), s.complaints_open, "flag"],
        ];
        grid.classList.add("reveal");
        grid.innerHTML = tiles.map(([label, value, iconName]) => `
          <div class="stat-tile">
            <div class="badge-icon" style="width:42px;height:42px;border-radius:12px;margin-bottom:14px">${icon(iconName)}</div>
            <div class="value">${value}</div>
            <div class="label">${label}</div>
          </div>
        `).join("");
      } catch (e) {
        grid.innerHTML = `<p class="error">${esc(t("common.error") + e.message)}</p>`;
      }
    }

    requireAdmin().then(loadStats);
    renderNav();
  </script>
</body>
</html>
