<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="admin.tabSubs">Подписки — Админ-панель</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="logo" href="../index.html"><span class="logo-mark"><svg class="i" aria-hidden="true"><use href="#i-wrench"></use></svg></span> Мастер рядом</a>
    <nav id="nav"></nav>
  </header>

  <main class="wide">
    <h1 data-i18n="admin.tabSubs">Подписки</h1>
    <div class="admin-tabs">
      <a href="index.html"><svg class="i" aria-hidden="true"><use href="#i-layout-grid"></use></svg><span data-i18n="admin.tabDashboard">Дашборд</span></a>
      <a href="users.html"><svg class="i" aria-hidden="true"><use href="#i-users"></use></svg><span data-i18n="admin.tabUsers">Пользователи</span></a>
      <a href="masters.html"><svg class="i" aria-hidden="true"><use href="#i-briefcase"></use></svg><span data-i18n="admin.tabMasters">Мастера</span></a>
      <a href="orders.html"><svg class="i" aria-hidden="true"><use href="#i-clipboard-list"></use></svg><span data-i18n="admin.tabOrders">Заказы</span></a>
      <a href="complaints.html"><svg class="i" aria-hidden="true"><use href="#i-flag"></use></svg><span data-i18n="admin.tabComplaints">Жалобы</span></a>
      <a href="subscriptions.html" class="active"><svg class="i" aria-hidden="true"><use href="#i-wallet"></use></svg><span data-i18n="admin.tabSubs">Подписки</span></a>
      <a href="categories.html"><svg class="i" aria-hidden="true"><use href="#i-list-filter"></use></svg><span data-i18n="admin.tabCategories">Категории</span></a>
    </div>
    <div id="content"><p class="muted" data-i18n="common.loading">Загрузка…</p></div>
  </main>

  <script src="../js/icons.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/nav.js"></script>
  <script src="guard.js"></script>
  <script>
    const STATE_PILL = {
      trial: ["info", "sub.stateTrial"],
      active: ["ok", "sub.stateActive"],
      expired: ["bad", "sub.stateExpired"],
    };

    function pendingHtml(payments) {
      if (!payments.length) return `<p class="muted">${t("admin.noPending")}</p>`;
      return `
        <div class="table-wrap"><table class="admin-table">
          <thead><tr><th>#</th><th>${t("admin.master")}</th><th>${t("common.phone")}</th><th>${t("sub.colPeriod")}</th><th>${t("sub.colAmount")}</th><th>${t("sub.colDate")}</th><th></th></tr></thead>
          <tbody>${payments.map(p => `
            <tr>
              <td>${p.id}</td>
              <td><a href="../master.html?id=${p.master_id}">${esc(p.master_name)}</a></td>
              <td>${esc(p.master_phone)}</td>
              <td>${plural(p.months, "p.months")}</td>
              <td><b>${formatPrice(p.amount)}</b></td>
              <td>${formatDate(p.created_at, true)}</td>
              <td><button class="btn small success" onclick="confirmPayment(${p.id}, ${p.amount})">${icon("check")}${t("admin.confirmPay")}</button></td>
            </tr>`).join("")}
          </tbody>
        </table></div>`;
    }

    function subsHtml(subs) {
      if (!subs.length) return `<p class="muted">${t("admin.noSubs")}</p>`;
      return `
        <div class="table-wrap"><table class="admin-table">
          <thead><tr><th>${t("admin.master")}</th><th>${t("common.phone")}</th><th>${t("admin.status")}</th><th>${t("admin.accessUntil")}</th><th>${t("admin.daysLeft")}</th><th></th></tr></thead>
          <tbody>${subs.map(s => {
            const [cls, key] = STATE_PILL[s.state];
            return `
            <tr>
              <td><a href="../master.html?id=${s.master_id}">${esc(s.name)}</a></td>
              <td>${esc(s.phone)}</td>
              <td><span class="status-pill ${cls}">${t(key)}</span></td>
              <td>${formatDate(s.access_until)}</td>
              <td>${plural(s.days_left, "p.days")}</td>
              <td><button class="btn small secondary" onclick="extend(${s.master_id})">${t("admin.extend")}</button></td>
            </tr>`;
          }).join("")}
          </tbody>
        </table></div>`;
    }

    async function load() {
      const content = document.getElementById("content");
      try {
        const [config, subs, pending] = await Promise.all([
          api.publicConfig(),
          api.adminSubscriptions(),
          api.adminSubscriptionPayments({ status: "pending" }),
        ]);
        content.innerHTML = `
          ${config.subscriptions_enabled ? "" : `<div class="notice" style="margin-bottom:20px">${icon("triangle-alert")}<span>${t("admin.subsDisabled")}</span></div>`}
          <div class="section-title" style="margin-top:0">${t("admin.pendingTitle")}</div>
          ${pendingHtml(pending)}
          <div class="section-title">${t("admin.tabMasters")}</div>
          ${subsHtml(subs)}`;
      } catch (e) {
        content.innerHTML = `<p class="error">${esc(t("common.error") + e.message)}</p>`;
      }
    }

    async function confirmPayment(id, amount) {
      if (!confirm(t("admin.confirmPayQ", { amount: formatPrice(amount) }))) return;
      try {
        await api.adminConfirmPayment(id);
        toast(t("admin.paidToast"));
        load();
      } catch (e) {
        toast(t("common.error") + e.message);
      }
    }

    async function extend(masterId) {
      try {
        await api.adminExtendSubscription(masterId, 1);
        toast(t("admin.extendedToast"));
        load();
      } catch (e) {
        toast(t("common.error") + e.message);
      }
    }

    requireAdmin().then(load);
    renderNav();
  </script>
</body>
</html>
