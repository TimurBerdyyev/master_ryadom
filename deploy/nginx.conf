# Web client + reverse proxy to the API (used by docker-compose "web" service).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 30m;  # up to 5 photos x MAX_UPLOAD_SIZE_MB

    # Behind Caddy (production) the client IP arrives in X-Forwarded-For. Trust it only from the
    # Docker network, so per-IP login limits see real users instead of one proxy address.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # The frontend calls the API at /api/... (see API_BASE in web/js/api.js)
    location ^~ /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        # Overwrite (not append) so clients can't spoof their IP and dodge the login rate limit
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # HTML/CSS/JS change on every deploy: always revalidate so users never mix old and new files
    location ~* \.(html|css|js)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
    }
}
