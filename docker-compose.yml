services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: master_ryadom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-master_ryadom}
      POSTGRES_DB: master_ryadom
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"  # только локально: не открывать БД в интернет

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"  # Redis без пароля — только локально

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://master_ryadom:${POSTGRES_PASSWORD:-master_ryadom}@db:5432/master_ryadom
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      SUBSCRIPTIONS_ENABLED: ${SUBSCRIPTIONS_ENABLED:-false}
      SUBSCRIPTION_TRIAL_DAYS: ${SUBSCRIPTION_TRIAL_DAYS:-30}
      SUBSCRIPTION_PRICE: ${SUBSCRIPTION_PRICE:-500}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-manual}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - db
      - redis
    ports:
      - "127.0.0.1:8000:8000"  # снаружи API доступен только через nginx: http://<сервер>:8080/api/

  web:
    image: nginx:alpine
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  db_data:
  uploads_data:
