services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: master_ryadom
      POSTGRES_PASSWORD: master_ryadom
      POSTGRES_DB: master_ryadom
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://master_ryadom:master_ryadom@db:5432/master_ryadom
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"

  web:
    image: nginx:alpine
    volumes:
      - ./web:/usr/share/nginx/html:ro
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  db_data:
