name: tests

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Tests
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://test:test@localhost:5432/test' || '' }}
        run: python -m pytest -q
      - name: Dependency audit
        if: matrix.database == 'sqlite'
        run: pip-audit -r requirements.txt

  docker-stack:
    # Builds the real images and runs the whole stack (Postgres, Redis, backend, nginx) like on a server.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: |
          cp .env.example .env
          docker compose up -d --build
      - name: Wait for the API
        run: |
          for i in $(seq 1 60); do curl -fs http://localhost:8080/api/health && exit 0; sleep 2; done
          docker compose logs backend; exit 1
      - name: Smoke test through nginx
        run: ./deploy/smoke_test.sh http://localhost:8080
      - name: Logs on failure
        if: failure()
        run: docker compose logs
