name: tests

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Tests
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://test:test@localhost:5432/test' || '' }}
        run: python -m pytest -q
      - name: Dependency audit
        if: matrix.database == 'sqlite'
        run: pip-audit -r requirements.txt

  docker-stack:
    # Builds the real images and runs the whole stack (Postgres, Redis, backend, nginx) like on a server.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: |
          cp .env.example .env
          docker compose up -d --build
      - name: Wait for the API
        run: |
          for i in $(seq 1 60); do curl -fs http://localhost:8080/api/health && exit 0; sleep 2; done
          docker compose logs backend; exit 1
      - name: Smoke test through nginx
        run: |
          # On failure, show the output and the last log lines as annotations (readable on the run page).
          if ! ./deploy/smoke_test.sh http://localhost:8080 > /tmp/smoke.txt 2>&1; then
            cat /tmp/smoke.txt
            tail -5 /tmp/smoke.txt | while IFS= read -r line; do echo "::error::smoke: ${line}"; done
            docker compose logs --no-color --tail 15 backend web 2>&1 | grep -iE "error|warn|exception|traceback| 4[0-9][0-9] | 5[0-9][0-9] " | tail -10 \
              | while IFS= read -r line; do echo "::error::log: ${line}"; done
            exit 1
          fi
          cat /tmp/smoke.txt
      - name: Logs on failure
        if: failure()
        run: docker compose logs

  render-image:
    # The single-service image used on Render: web client at /, API at /api, honours $PORT.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start
        run: |
          docker build -f deploy/render.Dockerfile -t master-ryadom-render .
          docker run -d --name app -p 10000:10000 -e PORT=10000 -e REDIS_URL= \
            -e DATABASE_URL=sqlite:////tmp/app.db master-ryadom-render
          for i in $(seq 1 60); do curl -fs http://localhost:10000/api/health && exit 0; sleep 2; done
          docker logs app; exit 1
      - name: Smoke test
        run: ./deploy/smoke_test.sh http://localhost:10000
      - name: Logs on failure
        if: failure()
        run: docker logs app
